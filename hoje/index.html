<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://gs-agendor-worker.robert131196.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hoje do SDR | Life B</title>
<link rel="icon" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#704B9B; --purple-d:#5a3a80; --magenta:#C2186B; --green:#15803d; --green-bg:#e8f6ee; --red:#b91c1c; --red-bg:#fdecec; --amber:#b45309; --amber-bg:#fff4e0;
  --text:#221B32; --muted:#5b5470; --bg:#f4f2f8; --card:#fff; --border:#e2dcee; --font:'Montserrat',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.45}
header{background:#fff;border-bottom:1px solid #e8e0f0;padding:0 16px;height:58px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(112,75,155,.22);position:sticky;top:0;z-index:50}
header img{height:28px}
header .t{font-size:13px;font-weight:800;color:var(--purple);letter-spacing:.8px;text-transform:uppercase}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:19px;font-weight:800;margin-bottom:4px;color:var(--purple-d)}
.sub,.muted{color:var(--muted);font-size:14px}
label.l{display:block;font-size:14px;font-weight:700;margin:14px 0 4px}
input[type=password]{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid #bdb3cf;border-radius:10px;font-family:var(--font);font-size:16px;background:#fff;color:var(--text)}
button{font-family:var(--font);font-weight:700;font-size:16px;min-height:44px;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--purple);color:#fff}
button.sec{background:#fff;color:var(--purple-d);border:1.5px solid var(--purple)}
button.link{background:none;color:var(--purple-d);text-decoration:underline;padding:6px 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--red);font-weight:700}
.hide{display:none!important}
.pct{font-size:46px;font-weight:800;color:var(--purple-d);line-height:1}
.bar{height:16px;background:#e6e0f0;border-radius:10px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--magenta));transition:width .4s}
.bar.verde>i{background:var(--green)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{flex:1;min-width:120px;border:1px solid var(--border);background:#faf8fd;border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.chip b{display:block;font-size:22px;color:var(--text)}
.bloco-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bloco-h h3{font-size:17px;font-weight:800}
.bloco-h .n{font-size:14px;font-weight:700;color:var(--muted)}
.dica{color:var(--muted);font-size:13px;margin-top:2px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff}
.item .tx{min-width:0;flex:1}
.item .emp{font-weight:800;overflow-wrap:anywhere}
.item .pas{font-size:13px;color:var(--muted)}
.item a.bt{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:10px;background:var(--purple);color:#fff;font-weight:700;font-size:14px;text-decoration:none;text-align:center}
.item.feito{background:var(--green-bg);border-color:#9bd3b1}
.item.feito .emp{text-decoration:line-through;color:var(--green)}
.item.feito .pas{color:var(--green);font-weight:700}
.item.feito a.bt{background:#fff;color:var(--green);border:1.5px solid #9bd3b1}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;color:#fff;background:var(--amber);margin-top:3px}
.vazio{color:var(--muted);font-size:14px;margin-top:8px}
.aviso{background:var(--amber-bg);border:1px solid #f2c987;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
.inb{border-color:#e9a8c8}
@media(max-width:480px){
  main{padding:10px} .card{padding:12px;border-radius:12px}
  .item{flex-direction:column;align-items:stretch} .item a.bt{width:100%}
  button{width:100%} .pct{font-size:40px}
}
</style>
</head>
<body>
<header><img src="/logo-lifeb.png" alt="Life B"><span class="t">Hoje do SDR</span></header>
<main>

<section id="s-login" class="card hide">
  <h2>Entrar</h2>
  <p class="sub">Digite a mesma senha da página de subir lista. Ela fica só neste aparelho se você marcar a caixinha.</p>
  <label class="l" for="tok">Senha</label>
  <input type="password" id="tok" autocomplete="current-password" placeholder="cole a senha aqui">
  <label style="display:flex;gap:10px;align-items:center;font-weight:600;min-height:44px;margin-top:8px"><input type="checkbox" id="lembrar" checked style="width:22px;height:22px"> Lembrar neste aparelho</label>
  <div class="row" style="margin-top:8px"><button id="bEntrar">Entrar</button></div>
  <p id="loginMsg" class="err" style="margin-top:8px"></p>
</section>

<section id="s-off" class="card hide">
  <h2>Página desligada</h2>
  <p class="sub">A visão do dia está desligada no momento. Fale com o Robert para ligar.</p>
  <div class="row" style="margin-top:10px"><button class="sec" id="bSair1">Sair</button></div>
</section>

<section id="s-dia" class="hide">
  <div class="card" id="topo">
    <h2 id="topoTitulo">Seu dia</h2>
    <div class="pct" id="topoPct">0%</div>
    <div class="bar" id="topoBar"><i></i></div>
    <div id="topoTxt" style="font-weight:700"></div>
    <div class="chips" id="chips"></div>
    <p class="muted" id="atualizado" style="margin-top:10px"></p>
    <div class="row" style="margin-top:6px"><button class="sec" id="bAtualizar">Atualizar agora</button></div>
  </div>
  <div id="avisos"></div>
  <div id="blocos"></div>
  <p class="muted" style="text-align:center;margin:12px 0"><button class="link" id="bSair2">Sair</button></p>
</section>

</main>
<script>
(function () {
'use strict';
var API = 'https://gs-agendor-worker.robert131196.workers.dev/sdr-hoje';
var $ = function (id) { return document.getElementById(id); };
var S = { token: '', timer: null, carregando: false };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function mostrar(id) { ['s-login', 's-off', 's-dia'].forEach(function (x) { $(x).classList.toggle('hide', x !== id); }); }
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

async function api(path) {
  var ctrl = new AbortController(); var tm = setTimeout(function () { ctrl.abort(); }, 45000);
  try {
    var r = await fetch(API + path, { method: 'GET', headers: { 'Authorization': 'Bearer ' + S.token }, signal: ctrl.signal });
    var j = await r.json().catch(function () { return {}; });
    j._status = r.status; return j;
  } finally { clearTimeout(tm); }
}

function hora(ms) { var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }

function desenhar(d) {
  $('topoPct').textContent = d.pctDia + '%';
  var barra = $('topoBar'); barra.firstChild.style.width = d.pctDia + '%'; barra.classList.toggle('verde', d.totalDia > 0 && d.feitasDia === d.totalDia);
  $('topoTxt').textContent = d.totalDia ? (d.feitasDia + ' de ' + plural(d.totalDia, 'atendimento feito', 'atendimentos feitos')) : 'Nenhum atendimento para hoje';
  $('topoTitulo').textContent = d.totalDia && d.feitasDia === d.totalDia ? 'Dia completo! 🎉' : 'Seu dia';
  var chips = $('chips'); chips.textContent = '';
  function chip(n, t) { var c = el('div', 'chip'); c.appendChild(el('b', null, String(n))); c.appendChild(document.createTextNode(t)); chips.appendChild(c); }
  if (d.cota) chip(d.usadosHoje + ' de ' + d.cota, 'aberturas novas liberadas hoje');
  chip(d.fila, d.fila === 1 ? 'aguardando na fila' : 'aguardando na fila');
  $('atualizado').textContent = 'Atualizado às ' + hora(d.atualizadoEm || Date.now()) + '. A tela se atualiza sozinha a cada 1 minuto.';
  var av = $('avisos'); av.textContent = '';
  if (d.truncado) av.appendChild(el('div', 'aviso', 'Atenção: o Agendor tem tarefas demais hoje e a lista pode estar incompleta. Confira também direto no Agendor.'));
  var bl = $('blocos'); bl.textContent = '';
  d.blocos.forEach(function (b) {
    var c = el('section', 'card' + (b.id.indexOf('inbound') === 0 ? ' inb' : ''));
    var h = el('div', 'bloco-h'); h.appendChild(el('h3', null, b.titulo));
    h.appendChild(el('span', 'n', b.progresso ? (b.feitas + ' de ' + b.total + ' feitas') : plural(b.total, 'empresa', 'empresas')));
    c.appendChild(h);
    if (b.dica) c.appendChild(el('p', 'dica', b.dica));
    if (b.progresso && b.total) { var bar = el('div', 'bar' + (b.feitas === b.total ? ' verde' : '')); var i = el('i'); i.style.width = b.pct + '%'; bar.appendChild(i); c.appendChild(bar); }
    if (!b.total) c.appendChild(el('p', 'vazio', 'Nada para hoje aqui.'));
    b.itens.forEach(function (it) {
      var li = el('div', 'item' + (it.feito ? ' feito' : ''));
      var tx = el('div', 'tx'); tx.appendChild(el('div', 'emp', it.empresa));
      tx.appendChild(el('div', 'pas', it.feito ? 'Tudo feito ✓' : (it.passoPendente || '') + (it.passosTotal > 1 ? ' (' + it.passosFeitos + ' de ' + it.passosTotal + ' passos)' : '')));
      if (it.depoisExpediente) tx.appendChild(el('span', 'pill', 'Chegou depois do expediente, entra na frente da fila'));
      li.appendChild(tx);
      var a = el('a', 'bt', 'Abrir no Agendor'); a.href = it.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; li.appendChild(a);
      c.appendChild(li);
    });
    bl.appendChild(c);
  });
}

async function carregar(silencioso) {
  if (S.carregando) return; S.carregando = true;
  try {
    var j = await api('/dados');
    if (j._status === 401) { sair('Senha não confere.'); return; }
    if (j._status === 429) { sair('Muitas tentativas. Espere 10 minutos.'); return; }
    if (j._status === 409) { mostrar('s-off'); return; }
    if (!j.ok) { if (!silencioso) $('atualizado').textContent = j.mensagem || 'Não consegui atualizar agora.'; else $('atualizado').textContent = (j.mensagem || 'Não consegui atualizar agora.') + ' Tentando de novo em 1 minuto.'; return; }
    desenhar(j); mostrar('s-dia');
  } catch (e) {
    $('atualizado').textContent = 'Sem conexão. Tentando de novo em 1 minuto.';
  } finally { S.carregando = false; }
}
function agendar() { if (S.timer) clearInterval(S.timer); S.timer = setInterval(function () { if (!document.hidden && !$('s-dia').classList.contains('hide')) carregar(true); }, 60000); }
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.token && !$('s-dia').classList.contains('hide')) carregar(true); });

async function entrar(token, silencioso) {
  S.token = token;
  var j;
  try { j = await api('/status'); } catch (e) { if (!silencioso) $('loginMsg').textContent = 'Sem conexão com a Bia. Tente de novo.'; return false; }
  if (j._status === 401) { lsDel('sh_tok'); if (!silencioso) $('loginMsg').textContent = 'Senha não confere.'; return false; }
  if (j._status === 429) { if (!silencioso) $('loginMsg').textContent = 'Muitas tentativas. Espere 10 minutos.'; return false; }
  if (!j.ok) { if (!silencioso) $('loginMsg').textContent = 'Não consegui entrar agora.'; return false; }
  if ($('lembrar').checked) lsSet('sh_tok', token);
  if (j.modo !== 'on') { mostrar('s-off'); return true; }
  agendar(); await carregar(false);
  if ($('s-dia').classList.contains('hide') && $('s-off').classList.contains('hide') && $('s-login').classList.contains('hide')) mostrar('s-dia');
  return true;
}
function sair(msg) { lsDel('sh_tok'); S.token = ''; if (S.timer) clearInterval(S.timer); $('tok').value = ''; $('loginMsg').textContent = msg || ''; mostrar('s-login'); }
$('bEntrar').onclick = async function () { var v = $('tok').value.trim(); if (!v) { $('loginMsg').textContent = 'Digite a senha.'; return; } $('loginMsg').textContent = ''; await entrar(v, false); };
$('tok').onkeydown = function (e) { if (e.key === 'Enter') $('bEntrar').click(); };
$('bAtualizar').onclick = function () { $('atualizado').textContent = 'Atualizando...'; carregar(false); };
$('bSair1').onclick = function () { sair(''); };
$('bSair2').onclick = function () { sair(''); };

window.__shTeste = { desenhar: desenhar, carregar: carregar };
(async function () {
  var t = lsGet('sh_tok');
  if (t) { var ok = await entrar(t, true); if (ok) return; }
  mostrar('s-login');
})();
})();
</script>
</body>
</html>
