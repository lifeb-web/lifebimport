// ── TAREFA ABERTA (criar / concluir) ────────────────────────────────────────────────────────────
// 🔴 FIX 19/09 (Robert: "hierarquia correta de prioridades... leads parados em destaque"): a fila já
// vinha ordenada certo pelo servidor, mas o card não DIZIA há quanto tempo o lead tá parado — só um
// ícone genérico. Agora mostra o número real de dias (sem tarefa nenhuma, ou tarefa vencida há X
// dias) — informação acionável, não só uma cor.
function _diasParado(dataISO) {
  if (!dataISO) return null;
  const ms = Date.now() - new Date(dataISO).getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}
function toggleTaskText(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const btn = document.getElementById(id + '-btn');
  const aindaClampeado = el.classList.toggle('clamped');
  if (btn) btn.textContent = aindaClampeado ? 'ver mais ▾' : 'ver menos ▴';
}
function _tarefaBlockHtml(l) {
  const t = l.tarefaAberta;
  if (!t) {
    const dias = _diasParado(l.data);
    const diasTxt = dias != null ? ` há ${dias} dia${dias===1?'':'s'}` : '';
    const critico = dias != null && dias >= 7;
    return `<div class="lc-task-row warn${critico ? ' stalled' : ''}">
      <span class="lc-task-icon">${critico ? '🆘' : '⚠️'}</span>
      <div class="lc-task-info"><div class="lc-task-text">Sem tarefa aberta${diasTxt}</div></div>
      <button class="lc-task-btn" onclick="showTaskForm(${l.row})">+ Criar</button>
    </div>`;
  }
  if (!t.texto && !t.id) {
    // fallback pré-A1: backend ainda não expõe id/texto da tarefa, só sabemos que existe uma aberta
    return `<div class="lc-task-row ok">
      <span class="lc-task-icon">📌</span>
      <div class="lc-task-info"><div class="lc-task-text">Tem tarefa aberta (detalhes chegam quando o backend novo subir essa parte)</div></div>
    </div>`;
  }
  const dueRaw    = t.dueDate ? String(t.dueDate).slice(0,10) : '';
  const hojeYMD   = new Date().toISOString().slice(0,10);
  const late      = !!(dueRaw && dueRaw < hojeYMD);
  const diasAtraso = late ? _diasParado(t.dueDate) : null;
  const stalled   = diasAtraso != null && diasAtraso >= 7;
  const dueLbl    = dueRaw
    ? (late ? `Venceu há ${diasAtraso} dia${diasAtraso===1?'':'s'}` : 'Vence ' + fmtData(dueRaw))
    : 'Sem data de vencimento';
  const TIPO_ICON = { LIGACAO: '📞', WHATSAPP: '💬', VISITA: '🏠', REUNIAO: '🤝', EMAIL: '✉️', PROPOSTA: '📄' };
  const tipoUp = String(t.tipo||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const tipoIcon = stalled ? '🆘' : (TIPO_ICON[tipoUp] || (late ? '🔴' : '📌'));
  const finishBtn = t.id ? `<button class="lc-task-btn finish" onclick="finishTask(${l.row}, ${Number(t.id)})">✓ Concluir</button>` : '';
  const textoBruto = t.texto || 'Tarefa aberta';
  const textoId = `task-text-${l.row}`;
  const textoHtml = textoBruto.length > 100
    ? `<div class="lc-task-text clamped" id="${textoId}">${esc(textoBruto)}</div><button class="lc-task-more" id="${textoId}-btn" onclick="toggleTaskText('${textoId}')">ver mais ▾</button>`
    : `<div class="lc-task-text">${esc(textoBruto)}</div>`;
  return `<div class="lc-task-row ${late ? 'late' : 'ok'}${stalled ? ' stalled' : ''}">
    <span class="lc-task-icon">${tipoIcon}</span>
    <div class="lc-task-info">${textoHtml}<div class="lc-task-due">${esc(dueLbl)}</div></div>
    ${finishBtn}
  </div>`;
}
// 🔴 FIX 19/09 (Robert: "quando clica em criar tarefa deve primeiro abrir perguntando o tipo e
// depois o texto"): fluxo de 2 passos — abre só perguntando o tipo; texto/data (passo 2) só
// aparecem depois de escolhido, em onTaskTipoChosen. Foca o seletor de tipo, não mais o texto.
function showTaskForm(row) {
  closeOtherCardUi(row);
  const form = document.getElementById('task-form-' + row);
  if (!form) return;
  form.classList.add('visible');
  _revealComDestaque(form);
  const tipoIn = document.getElementById('task-tipo-' + row);
  if (tipoIn) tipoIn.focus();
}
const TIPOS_COM_HORARIO = new Set(['VISITA', 'REUNIAO']); // mesma regra do backend, ver comentário lá
function onTaskTipoChosen(row) {
  const tipoIn = document.getElementById('task-tipo-' + row);
  const step2  = document.getElementById('task-step2-' + row);
  if (!tipoIn || !step2) return;
  if (!tipoIn.value) { step2.classList.remove('visible'); return; }
  step2.classList.add('visible');
  _revealComDestaque(step2);
  const dateIn = document.getElementById('task-due-' + row);
  if (dateIn && !dateIn.value) {
    const d = new Date(); d.setDate(d.getDate() + 1);
    dateIn.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  // 🔴 FIX 19/09 (Robert: "quando for visita que precisa de data e hora definidos?"): Visita/
  // Reunião são compromisso real — só pra esses 2 tipos aparece o campo de horário (obrigatório).
  const precisaHorario = TIPOS_COM_HORARIO.has(tipoIn.value);
  const timeWrap = document.getElementById('task-time-wrap-' + row);
  if (timeWrap) timeWrap.style.display = precisaHorario ? '' : 'none';
  const lbl = document.getElementById('task-step2-label-' + row);
  if (lbl) lbl.textContent = precisaHorario ? '2) o que precisa ser feito, dia e horário' : '2) o que precisa ser feito e até quando';
  const ta = document.getElementById('task-texto-' + row);
  if (ta) ta.focus();
}
function hideTaskForm(row) {
  const form = document.getElementById('task-form-' + row);
  if (form) form.classList.remove('visible');
  const tipoIn = document.getElementById('task-tipo-' + row);
  if (tipoIn) tipoIn.value = '';
  const step2 = document.getElementById('task-step2-' + row);
  if (step2) step2.classList.remove('visible'); // reseta pro passo 1 na próxima abertura
  const timeWrap = document.getElementById('task-time-wrap-' + row);
  if (timeWrap) timeWrap.style.display = 'none';
}
async function saveTask(row) {
  const ta      = document.getElementById('task-texto-' + row);
  const dateIn  = document.getElementById('task-due-' + row);
  const tipoIn  = document.getElementById('task-tipo-' + row);
  const timeIn  = document.getElementById('task-time-' + row);
  const texto   = ta ? ta.value.trim() : '';
  const dueDate = dateIn ? dateIn.value : '';
  const tipo    = tipoIn ? tipoIn.value : '';
  const precisaHorario = TIPOS_COM_HORARIO.has(tipo);
  const dueTime = precisaHorario && timeIn ? timeIn.value : '';
  // 🔴 FIX 18/09 (Robert: "e se o rep precisar criar uma tarefa... mas na verdade ele vai mandar um
  // zap?"): o tipo real do contato (Ligação/WhatsApp/Visita/...) é obrigatório — o Agendor guarda isso
  // por tarefa, e outras automações da Life B usam esse mesmo campo pra decisões reais (ex: só Visita/
  // Reunião avançam a etapa do negócio). O painel nunca assume um tipo por padrão.
  if (!tipo)    { showToast('Escolha como vai ser o contato (ligação, WhatsApp, visita...)'); if (tipoIn) tipoIn.focus(); return; }
  if (!texto)   { showToast('Escreva o que precisa ser feito'); if (ta) ta.focus(); return; }
  if (!dueDate) { showToast('Escolha a data de vencimento'); if (dateIn) dateIn.focus(); return; }
  // 🔴 FIX 19/09 (Robert, achado real: Visita sem horário fixo era incoerente): Visita/Reunião são
  // compromisso real, horário é obrigatório — mesma regra validada de novo no backend.
  if (precisaHorario && !dueTime) { showToast('Escolha o horário do compromisso'); if (timeIn) timeIn.focus(); return; }
  // 🔴 FIX 19/09 (Robert: "parece que ainda tá resolvendo tudo no front e não tem backend" +
  // "demorando muito, sem efeito nenhum mostrando que o card foi lá pro final" + depois "coloca
  // confirmação em toda escrita sensível" + "voltou o desfazer? era um trunfo nosso"): as 3 coisas
  // viram uma só — fecha o formulário e marca o card como "salvando" NA HORA (feedback imediato,
  // visual, sem mexer em dado nenhum), mas só manda pro Agendor de verdade alguns segundos depois,
  // dando a janela de "Desfazer" (ver _confirmarComJanela). O backend continua sendo a única fonte
  // de verdade: quando a escrita real acontece, ele manda o `lead` INTEIRO recém-calculado — o
  // front só troca pelo que veio, nunca inventa status/bucket sozinho.
  hideTaskForm(row);
  const _card = document.querySelector(`.lead-card[data-row="${row}"]`);
  if (_card) _card.classList.add('lc-salvando');
  _confirmarComJanela('task-' + row, {
    mensagem: 'Tarefa agendada — Desfazer?',
    ms: 5000,
    aoDesfazer: () => {
      if (_card) _card.classList.remove('lc-salvando');
      showTaskForm(row);
      const tipoIn2 = document.getElementById('task-tipo-' + row);
      if (tipoIn2) tipoIn2.value = tipo;
      onTaskTipoChosen(row);
      const ta2 = document.getElementById('task-texto-' + row);
      if (ta2) ta2.value = texto;
      const dateIn2 = document.getElementById('task-due-' + row);
      if (dateIn2) dateIn2.value = dueDate;
      const timeIn2 = document.getElementById('task-time-' + row);
      if (timeIn2 && dueTime) timeIn2.value = dueTime;
    },
    executar: async () => {
      try {
        const data = await apiPost('/task/create', { dealId: row, texto, dueDate, tipo, dueTime });
        const idx = _rawLeads.findIndex(l => l.row === row);
        if (idx !== -1 && data && data.lead) {
          _rawLeads[idx] = _transformarLeadAgendor(data.lead);
          _rawLeads = _ordenarFilaLocal(_rawLeads);
        }
        showToast('Tarefa criada ✓');
        renderLeads(_rawLeads, row);
        const _cardNovo = document.querySelector(`.lead-card[data-row="${row}"]`);
        if (_cardNovo) _revealComDestaque(_cardNovo);
      } catch (err) {
        console.error('saveTask failed:', err);
        if (_card) _card.classList.remove('lc-salvando');
        showErrorToast('Erro ao criar tarefa: ' + err.message, { acao: 'criar tarefa', dealId: row });
      }
    },
  });
}
async function finishTask(row, taskId) {
  if (!taskId) { showToast('Não deu pra identificar a tarefa — recarregue a página e tente de novo'); return; }
  // 🔴 FIX 19/09: modal nativo de confirm() removido — vira janela de "Desfazer" de alguns segundos
  // (ver _confirmarComJanela), igual toda outra escrita sensível do painel agora.
  const _card = document.querySelector(`.lead-card[data-row="${row}"]`);
  if (_card) _card.classList.add('lc-salvando');
  _confirmarComJanela('finish-' + row, {
    mensagem: 'Tarefa concluída — Desfazer?',
    ms: 5000,
    aoDesfazer: () => { if (_card) _card.classList.remove('lc-salvando'); },
    executar: async () => {
      try {
        const data = await apiPost('/task/finish', { dealId: row, taskId });
        const idx = _rawLeads.findIndex(l => l.row === row);
        if (idx !== -1 && data && data.lead) {
          _rawLeads[idx] = _transformarLeadAgendor(data.lead);
          _rawLeads = _ordenarFilaLocal(_rawLeads);
        }
        showToast('Tarefa concluída ✓');
        renderLeads(_rawLeads, row);
        const _cardNovo = document.querySelector(`.lead-card[data-row="${row}"]`);
        if (_cardNovo) _revealComDestaque(_cardNovo);
      } catch (err) {
        console.error('finishTask failed:', err);
        if (_card) _card.classList.remove('lc-salvando');
        showErrorToast('Erro ao concluir tarefa: ' + err.message, { acao: 'concluir tarefa', dealId: row });
      }
    },
  });
}

// ── OBS (unificada com "Obs. do SDR" — ver nota no topo do arquivo) ─────────────────────────────
function buildObsViewHtml(row, obs) {
  if (obs && obs.trim())
    return `<div class="obsr-text" id="obsr-text-${row}">${esc(obs)}</div>
            <button class="obsr-edit-btn" onclick="toggleObsEdit(${row})">${SVG_EDIT} Editar</button>`;
  return `<button class="obsr-add-btn" onclick="toggleObsEdit(${row})">＋ Adicionar observação</button>`;
}
function toggleObsEdit(row) {
  const rep = document.getElementById('obsr-' + row);
  if (!rep) return;
  rep.classList.add('editing');
  _revealComDestaque(rep);
  const ta = document.getElementById('obs-' + row);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function cancelObsEdit(row) {
  const rep = document.getElementById('obsr-' + row);
  if (!rep) return;
  const ta = document.getElementById('obs-' + row);
  if (ta) ta.value = rep.dataset.saved || '';
  rep.classList.remove('editing');
}
async function saveObs(row) {
  const ta  = document.getElementById('obs-' + row);
  const rep = document.getElementById('obsr-' + row);
  if (!ta) return;
  const texto = ta.value.trim();
  if (!texto) { showToast('Escreva algo antes de salvar'); ta.focus(); return; }
  const textoAnterior = rep ? (rep.dataset.saved || '') : '';
  const _cardObs = document.querySelector(`.lead-card[data-row="${row}"]`);
  const estavaConcluindo = !!(_cardObs && _cardObs.classList.contains('concluding'));
  // Feedback imediato: fecha a edição e já mostra o texto novo na tela (visual, ver nota em
  // saveTask) — a gravação de verdade só acontece depois da janela de "Desfazer".
  if (rep) {
    rep.classList.remove('editing');
    const viewDiv = rep.querySelector('.obsr-view');
    if (viewDiv) viewDiv.innerHTML = buildObsViewHtml(row, texto);
  }
  _confirmarComJanela('obs-' + row, {
    mensagem: 'Observação salva — Desfazer?',
    ms: 5000,
    aoDesfazer: () => {
      if (rep) {
        rep.classList.add('editing');
        const viewDiv = rep.querySelector('.obsr-view');
        if (viewDiv) viewDiv.innerHTML = buildObsViewHtml(row, textoAnterior);
      }
      const ta2 = document.getElementById('obs-' + row);
      if (ta2) { ta2.value = texto; ta2.focus(); }
      if (estavaConcluindo) {
        const saveBtn = document.getElementById('obs-save-' + row);
        if (saveBtn) saveBtn.textContent = 'Salvar e concluir';
      }
    },
    executar: async () => {
      try {
        // 🔴 FIX 19/09: grava SEMPRE como "Obs. do Rep" (nunca "Obs. do SDR" — ver comentário no
        // backend) e usa o `lead` autoritativo devolvido, nunca assume que o texto local bate 100%
        // com o que o servidor gravou de verdade.
        const data = await apiPost('/obs', { dealId: row, texto });
        const idx = _rawLeads.findIndex(l => l.row === row);
        if (idx !== -1 && data && data.lead) _rawLeads[idx] = _transformarLeadAgendor(data.lead);
        const leadAtualizado = _rawLeads[idx];
        const textoReal = leadAtualizado ? leadAtualizado.obs_rep : texto;
        if (rep) {
          rep.dataset.saved = textoReal;
          const viewDiv = rep.querySelector('.obsr-view');
          if (viewDiv) viewDiv.innerHTML = buildObsViewHtml(row, textoReal);
        }
        setLeadTs(row);
        showToast('Observação salva ✓');
        if (estavaConcluindo) concludeCard(row);
        else scheduleReload(2500);
      } catch (err) {
        console.error('saveObs failed:', err);
        showErrorToast('Erro ao salvar observação: ' + err.message, { acao: 'salvar observação', dealId: row });
      }
    },
  });
}

// ── MARCAR GANHO / PERDIDO ───────────────────────────────────────────────────────────────────────
// Só mexe em _rawLeads/DOM DEPOIS de confirmar sucesso no servidor — e o próprio envio pro servidor
// só acontece depois da janela de "Desfazer" (ver _confirmarComJanela e nota no topo do arquivo).
function openGanhoPrompt(row) {
  closeOtherCardUi(row);
  const prompt = document.getElementById('sp-' + row);
  if (!prompt) return;
  prompt.dataset.tipo = 'ganho';
  prompt.dataset.step = 'valor';
  const lbl = document.getElementById('sp-label-' + row);
  if (lbl) lbl.textContent = '💰 Qual foi o valor do fechamento?';
  const rowValor = document.getElementById('sp-row-valor-' + row);
  if (rowValor) rowValor.style.display = '';
  const motivoSel = document.getElementById('sp-motivo-' + row);
  if (motivoSel) motivoSel.style.display = 'none';
  const obsTa = document.getElementById('sp-obs-' + row);
  if (obsTa) obsTa.style.display = 'none';
  const warn = document.getElementById('sp-warn-' + row);
  if (warn) warn.style.display = '';
  const valorIn = document.getElementById('sp-valor-' + row);
  if (valorIn) valorIn.value = '';
  const preview = document.getElementById('sp-preview-' + row);
  if (preview) preview.textContent = '';
  const saveBtn = document.getElementById('sp-save-' + row);
  if (saveBtn) saveBtn.textContent = 'Confirmar Ganho';
  prompt.classList.add('visible');
  _revealComDestaque(prompt);
  // 🔴 FIX 19/09 (Robert: "quando clica em marcar ganho já abre o teclado e fica na frente, nem
  // mostrando o campo de valor"): focar na hora dispara o teclado do celular ANTES do scroll do
  // _revealComDestaque terminar — o teclado sobe e cobre exatamente o campo que acabou de aparecer.
  // Espera o scroll assentar antes de focar, aí o campo já está visível acima do teclado.
  if (valorIn) setTimeout(() => valorIn.focus(), 350);
}
function openPerdidoPrompt(row) {
  closeOtherCardUi(row);
  const prompt = document.getElementById('sp-' + row);
  if (!prompt) return;
  prompt.dataset.tipo = 'perdido';
  prompt.dataset.step = 'motivo';
  const lbl = document.getElementById('sp-label-' + row);
  if (lbl) lbl.textContent = '❌ Qual o motivo da perda?';
  const rowValor = document.getElementById('sp-row-valor-' + row);
  if (rowValor) rowValor.style.display = 'none';
  const motivoSel = document.getElementById('sp-motivo-' + row);
  if (motivoSel) { motivoSel.value = ''; motivoSel.style.display = ''; }
  const obsTa = document.getElementById('sp-obs-' + row);
  if (obsTa) { obsTa.value = ''; obsTa.style.display = 'none'; }
  const warn = document.getElementById('sp-warn-' + row);
  if (warn) warn.style.display = 'none';
  const saveBtn = document.getElementById('sp-save-' + row);
  if (saveBtn) saveBtn.textContent = 'Avançar →';
  prompt.classList.add('visible');
  _revealComDestaque(prompt);
  if (motivoSel) setTimeout(() => motivoSel.focus(), 350); // mesmo cuidado do Ganho, ver comentário lá
}
function cancelStatusPrompt(row) {
  const prompt = document.getElementById('sp-' + row);
  if (prompt) { prompt.classList.remove('visible'); prompt.dataset.tipo = ''; prompt.dataset.step = ''; }
}
function spKeyDown(e, row) {
  if (e.key === 'Enter') { e.preventDefault(); submitStatusPrompt(row); }
}
async function submitStatusPrompt(row) {
  const prompt = document.getElementById('sp-' + row);
  if (!prompt) return;
  const tipo    = prompt.dataset.tipo;
  const saveBtn = document.getElementById('sp-save-' + row);

  if (tipo === 'ganho') {
    const valorIn = document.getElementById('sp-valor-' + row);
    const valorTexto = valorIn ? valorIn.value : '';
    const n = parseMoney(valorTexto);
    if (isNaN(n) || n <= 0) { showToast('Informe o valor do fechamento'); if (valorIn) valorIn.focus(); return; }
    // 🔴 FIX 19/09 (Robert: "coloca confirmação em toda escrita sensível" + "volta o desfazer"):
    // Ganho é a escrita mais sensível do painel — mesma janela de "Desfazer" de todas as outras
    // (ver _confirmarComJanela), só que um pouco maior (6s) dado o peso da ação.
    prompt.classList.remove('visible');
    const _card = document.querySelector(`.lead-card[data-row="${row}"]`);
    if (_card) _card.classList.add('lc-salvando');
    _confirmarComJanela('status-' + row, {
      mensagem: '🎉 Ganho de ' + cur(n) + ' — Desfazer?',
      ms: 6000,
      aoDesfazer: () => {
        if (_card) _card.classList.remove('lc-salvando');
        openGanhoPrompt(row);
        // 400ms: depois do foco automático (350ms) do openGanhoPrompt — senão o foco "rouba" de
        // volta pro campo vazio depois da gente já ter restaurado o valor digitado.
        setTimeout(() => {
          const valorIn2 = document.getElementById('sp-valor-' + row);
          if (valorIn2) { valorIn2.value = valorTexto; valorIn2.focus(); spPreview(valorIn2, row); }
        }, 400);
      },
      executar: async () => {
        try {
          const data = await apiPost('/status', { dealId: row, acao: 'ganho', valor: n });
          const idx = _rawLeads.findIndex(l => l.row === row);
          if (idx !== -1 && data && data.lead) _rawLeads[idx] = _transformarLeadAgendor(data.lead);
          setLeadTs(row);
          showToast('🎉 Negócio marcado como Ganho');
          enterConcludingMode(row);
        } catch (err) {
          console.error('submitStatusPrompt ganho failed:', err);
          if (_card) _card.classList.remove('lc-salvando');
          showErrorToast('Erro ao marcar ganho: ' + err.message, { acao: 'marcar Ganho', dealId: row });
        }
      },
    });
    return;
  }

  // Perdido — 2 passos: motivo, depois observação (ambos obrigatórios no contrato novo). Só o passo
  // final (depois da observação) realmente grava — os passos de navegação nunca precisam de undo.
  const step = prompt.dataset.step;
  if (step === 'motivo') {
    const motivoSel = document.getElementById('sp-motivo-' + row);
    const motivo = motivoSel ? motivoSel.value : '';
    if (!motivo) { showToast('Selecione o motivo da perda'); if (motivoSel) motivoSel.focus(); return; }
    prompt.dataset.step = 'obs';
    const obsTa = document.getElementById('sp-obs-' + row);
    if (obsTa) obsTa.style.display = '';
    const warn = document.getElementById('sp-warn-' + row);
    if (warn) warn.style.display = '';
    if (saveBtn) saveBtn.textContent = 'Confirmar Perda';
    if (obsTa) obsTa.focus();
    return;
  }
  const motivoSel = document.getElementById('sp-motivo-' + row);
  const motivo    = motivoSel ? motivoSel.value : '';
  const obsTa     = document.getElementById('sp-obs-' + row);
  const observacao = obsTa ? obsTa.value.trim() : '';
  if (!observacao) { showToast('Escreva uma observação sobre a perda'); if (obsTa) obsTa.focus(); return; }
  prompt.classList.remove('visible');
  const _card = document.querySelector(`.lead-card[data-row="${row}"]`);
  if (_card) _card.classList.add('lc-salvando');
  _confirmarComJanela('status-' + row, {
    mensagem: '❌ Perda registrada — Desfazer?',
    ms: 6000,
    aoDesfazer: () => {
      if (_card) _card.classList.remove('lc-salvando');
      openPerdidoPrompt(row);
      // 400ms: depois do foco automático (350ms) do openPerdidoPrompt — vai direto pro passo da
      // observação (não faz sentido o rep refazer o passo do motivo que ele já tinha escolhido).
      setTimeout(() => {
        prompt.dataset.step = 'obs';
        const motivoSel2 = document.getElementById('sp-motivo-' + row);
        if (motivoSel2) motivoSel2.value = motivo;
        const obsTa2 = document.getElementById('sp-obs-' + row);
        if (obsTa2) { obsTa2.style.display = ''; obsTa2.value = observacao; obsTa2.focus(); }
        const lbl2 = document.getElementById('sp-label-' + row);
        if (lbl2) lbl2.textContent = '❌ Qual o motivo da perda?';
        const saveBtn2 = document.getElementById('sp-save-' + row);
        if (saveBtn2) saveBtn2.textContent = 'Confirmar Perda';
      }, 400);
    },
    executar: async () => {
      try {
        const data = await apiPost('/status', { dealId: row, acao: 'perdido', motivo, observacao });
        const idx = _rawLeads.findIndex(l => l.row === row);
        if (idx !== -1 && data && data.lead) _rawLeads[idx] = _transformarLeadAgendor(data.lead);
        showToast('Negócio marcado como Perdido');
        _removeLeadToHistory(row);
      } catch (err) {
        console.error('submitStatusPrompt perdido failed:', err);
        if (_card) _card.classList.remove('lc-salvando');
        showErrorToast('Erro ao registrar perda: ' + err.message, { acao: 'marcar Perdido', dealId: row });
      }
    },
  });
}

// ── RENDER LEADS ──────────────────────────────────────────────
function renderLeads(leads, highlightRow) {
  const list = document.getElementById('leads-list');
  const wrap = document.getElementById('show-more-wrap');
  if (!list) return;

  const expandedRows   = new Set();
  const concludingRows = new Set();
  const obsDrafts      = {};
  const contactOpen    = new Set();
  list.querySelectorAll('.lead-card').forEach(c => {
    const row = c.dataset.row;
    if (c.classList.contains('expanded')) {
      expandedRows.add(row);
      const ta = document.getElementById('obs-' + row);
      if (ta) obsDrafts[row] = ta.value;
    }
    if (c.classList.contains('concluding')) concludingRows.add(row);
    const cp = document.getElementById('cp-' + row);
    if (cp && cp.style.display === 'block') contactOpen.add(row);
  });

  // B3: a ordem já vem pronta do servidor (Frente A2 — ordenarFila) — o painel só renderiza como
  // recebeu. Zero sort no cliente de propósito (fonte única de verdade, sem risco de cliente e
  // servidor divergirem). Enquanto A2 não sobe no backend, a ordem reflete a listagem crua do
  // Agendor — não é bug deste arquivo, é o contrato ainda incompleto do outro lado.
  _allLeads = leads.slice();

  document.getElementById('sum-ag').textContent   = _allLeads.filter(l=>l.status==='Aguardando contato').length;
  document.getElementById('sum-cont').textContent = _allLeads.filter(l=>l.status==='Em contato').length;
  document.getElementById('sum-neg').textContent  = _allLeads.filter(l=>l.status==='Em negociação').length;
  document.getElementById('sum-pv').textContent   = _allLeads.filter(l=>_leadMatchesFilter(l,'__pos_venda__')).length;
  document.getElementById('sum-tot').textContent  = _allLeads.length;

  (function() {
    const bar = document.getElementById('filter-bar');
    const lbl = document.getElementById('filter-label');
    const clr = document.getElementById('filter-clear');
    if (!bar || !lbl || !clr) return;
    const parts = [];
    if (_activeFilter) parts.push('Mostrando: ' + _filterLabel(_activeFilter));
    if (_searchQuery.trim()) parts.push('🔍 "' + _searchQuery.trim() + '"');
    if (parts.length) {
      bar.classList.add('visible');
      lbl.textContent = parts.join(' · ');
      clr.onclick = function() { clearFilter(); closeSearch(); };
    } else {
      bar.classList.remove('visible');
    }
  })();

  if (!_allLeads.length) {
    list.innerHTML = `<div class="empty-state"><strong>Tudo em dia!</strong>Nenhum lead ativo no momento.</div>`;
    if (wrap) wrap.innerHTML = '';
    return;
  }

  const searchActive = _searchQuery.trim().length > 0;
  let toShow = searchActive ? _applySearch(_allLeads)
             : (_activeFilter ? _allLeads.filter(l => _leadMatchesFilter(l, _activeFilter)) : _allLeads);
  if (searchActive && !toShow.length) {
    const hasInHistory = Array.isArray(_history) && _applySearch(_history).length > 0;
    const msg = hasInHistory
      ? `<strong>Não está nos ativos</strong>Resultado encontrado no histórico abaixo.`
      : `<strong>Sem resultado</strong>Nenhum lead encontrado para "${esc(_searchQuery.trim())}".`;
    list.innerHTML = `<div class="empty-state">${msg}</div>`;
    if (wrap) wrap.innerHTML = '';
    return;
  }
  const visible = searchActive ? toShow : toShow.slice(0, _visibleCount);

  list.innerHTML = visible.map(l => {
    const nomeRaw  = toTitleCase(l.nome||'');
    const nomeEmp  = toTitleCase(l.empresa||'');
    const titulo   = esc(nomeEmp || nomeRaw || '—');
    const cidadeUF = [abreviarCidade(toTitleCase(l.cidade)),(l.estado||'').toUpperCase()].filter(v=>v&&v.trim()).join(' · ');
    const sClass   = statusClass(l.status);
    const bClass   = borderClass(l.status);
    const pot      = l.pot > 0 ? cur(l.pot) : '';
    const wa       = fmtWA(l.whatsapp);
    const mapLink  = buildMapsUrl(l.empresa||l.nome, l.cidade, l.estado);

    const cnpj      = l.cnpj||'';
    const endereco  = toTitleCase(l.endereco||'');
    const funilBadge = l.funil_tag ? `<span class="lc-funil-badge ${l.funil_tag}">${FUNIL_BADGE_LABEL[l.funil_tag] || l.funil_tag}</span>` : '';

    const cpRows = _buildCpRows(l, { nomeRaw, nomeEmp, cnpj, endereco, phone, contato });
    const hasContact = cpRows.length > 0;

    const obsViewHtml = buildObsViewHtml(l.row, l.obs_rep||''); // 🔴 FIX 19/09: era obs_sdr por engano — a caixa editável é sempre a do REP
    const tarefaHtml  = _tarefaBlockHtml(l);

    return `
    <div class="lead-card ${bClass}" data-row="${l.row}">
      <div class="lc-body">
        <div class="lc-top">
          <div class="lc-empresa">${titulo}${funilBadge}</div>

        <div id="task-wrap-${l.row}">${tarefaHtml}</div>
        <div class="lc-task-form" id="task-form-${l.row}">
          <div class="lc-sp-label">📌 Nova tarefa — 1) como vai ser o contato?</div>
          <select id="task-tipo-${l.row}" class="lc-task-tipo" onchange="onTaskTipoChosen(${l.row})">
            <option value="">Toque para escolher…</option>

            <!-- 🔴 FIX 19/09 (Robert, achado real: "criei uma tarefa de visita e não dava pra

                 compromisso real (o rep vai até o cliente ou entra numa call marcada) — pede

        <div class="lc-obs-rep" id="obsr-${l.row}" data-saved="${esc(l.obs_rep||'')}">
          <div class="obsr-view">${obsViewHtml}</div>
          <div class="obsr-edit-wrap" id="obsr-edit-${l.row}">
            <div class="obs-conclude-banner">📝 Registre uma observação antes de concluir</div>

              placeholder="O que aconteceu? Ex: ligou, não atendeu, vai tentar amanhã">${esc(l.obs_rep||'')}</textarea>
            <div class="lc-obs-footer">
              <span class="lc-obs-fb" id="obs-fb-${l.row}"></span>
              <button class="obsr-cancel-btn"  id="obs-cancel-${l.row}"   onclick="cancelObsEdit(${l.row})">Cancelar</button>
              <button class="lc-obs-clear"    id="obs-clear-${l.row}"   onclick="clearObs(${l.row})">Limpar</button>
              <button class="lc-obs-conclude" id="obs-conclude-${l.row}" onclick="maybeConclude(${l.row})">Pular →</button>
              <button class="lc-obs-save"     id="obs-save-${l.row}"     onclick="saveObs(${l.row})">Salvar</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  if (wrap) {
    const filtered2 = _activeFilter
      ? _allLeads.filter(l => _leadMatchesFilter(l, _activeFilter) && _matchesSearch(l))
      : _allLeads.filter(l => _matchesSearch(l));
    const hasMore2 = !searchActive && _visibleCount < filtered2.length;
    const hasLess2 = !searchActive && _visibleCount > LIMIT;
    wrap.innerHTML = (hasMore2 || hasLess2) ? `<div class="show-more-row">
      ${hasLess2 ? `<button class="show-less-btn" onclick="showLess()">▲ Ver menos</button>` : ''}
      ${hasMore2 ? `<button class="show-more-btn" onclick="showMore()">Ver mais ▾</button>` : ''}
    </div>` : '';
  }

  expandedRows.forEach(row => {
    const card = list.querySelector(`.lead-card[data-row="${row}"]`);
    if (!card) return;
    card.classList.add('expanded');
    const btn = card.querySelector('.lc-toggle');
    if (btn) { btn.querySelector('.tt').textContent='menos'; btn.setAttribute('aria-expanded','true'); }
    const ta = document.getElementById('obs-' + row);
    if (ta && obsDrafts[row] !== undefined) ta.value = obsDrafts[row];
  });
  contactOpen.forEach(row => {
    const cp  = document.getElementById('cp-' + row);
    const btn = list.querySelector(`.lead-card[data-row="${row}"] .lc-icon-btn.contact`);
    if (cp)  cp.style.display = 'block';
    if (btn) { btn.classList.add('active'); btn.setAttribute('aria-expanded','true'); }
  });
  concludingRows.forEach(row => {
    const card = list.querySelector(`.lead-card[data-row="${row}"]`);
    if (!card) return;
    card.classList.add('concluding');
    const rep = document.getElementById('obsr-' + row);
    if (rep && !rep.classList.contains('editing')) rep.classList.add('editing');
    const saveBtn = document.getElementById('obs-save-' + row);
    if (saveBtn) saveBtn.textContent = 'Salvar e concluir';
  });

  if (highlightRow) {
    const moved = list.querySelector(`.lead-card[data-row="${highlightRow}"]`);
    if (moved) {
      moved.classList.add('just-placed');
      moved.addEventListener('animationend', () => moved.classList.remove('just-placed'), { once:true });
    }
  }
}

// ── HISTÓRICO ─────────────────────────────────────────────────
let _history     = null;
let _histLoaded  = false;
let _histPage    = 1;
let _histTab     = null; // null | 'fechados' | 'perdidos'
let _histPeriodo = 'total'; // 'mes' | 'mes_passado' | 'total' — default 'total' pra nunca esconder ganhos antigos
const HIST_PAGE_SIZE = 5;

function collapseHistorico() {
  const sec = document.getElementById('historico-section');
  if (!sec || !sec.classList.contains('open')) return;
  sec.classList.remove('open');
  const btn = sec.querySelector('.hist-header');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  _histTab = null; _histPage = 1;
  _teardownHistObserver();
}

function toggleHistorico() {
  const section = document.getElementById('historico-section');
  if (!section) return;
  const opening = !section.classList.contains('open');
  section.classList.toggle('open');
  const btn = section.querySelector('.hist-header');
  if (btn) btn.setAttribute('aria-expanded', opening);
  if (opening) {
    if (!_histLoaded) loadHistorico();
    else renderHistorico();
    _setupHistAutoCollapse();
  } else {
    _teardownHistObserver();
    _histTab = null; _histPage = 1;
  }
}
function _teardownHistObserver() {
  if (window._histObserver) { window._histObserver.disconnect(); window._histObserver = null; }
  if (window._histCollapseTimer) { clearTimeout(window._histCollapseTimer); window._histCollapseTimer = null; }
}
function _setupHistAutoCollapse() {
  _teardownHistObserver();
  const leadsList = document.getElementById('leads-list');
  if (!leadsList) return;
  let wasHidden = false;
  window._histObserver = new IntersectionObserver(function(entries) {
    const entry = entries[0];
    if (!entry.isIntersecting) {
      wasHidden = true;
      if (window._histCollapseTimer) { clearTimeout(window._histCollapseTimer); window._histCollapseTimer = null; }
    } else if (wasHidden) {
      window._histCollapseTimer = setTimeout(function() {
        collapseHistorico();
        _teardownHistObserver();
      }, 3000);
    }
  }, { threshold: 0.6 });
  window._histObserver.observe(leadsList);
}

// B5 — troca definitiva do proxy GAS morto (PROXY_URL + '?action=rep_history', que devolvia 404 e
// por isso "faltavam vários leads ganhos") pela API nova, que lê direto o D1 do Dashboard Geral
// (rápido, sem depender do Agendor ao vivo). Período default 'total' pra nunca esconder ganho
// antigo — o rep pode filtrar por mês se quiser algo mais recente.
async function loadHistorico(periodo) {
  if (periodo) _histPeriodo = periodo;
  const body = document.getElementById('hist-body');
  if (!body) return;
  body.innerHTML = `<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px;font-weight:600">Carregando…</div>`;
  try {
    const _ctrl = new AbortController();
    const _tid  = setTimeout(() => _ctrl.abort(), 25000);
    const url   = HISTORICO_URL + '?rep=' + REP_NAME + '&periodo=' + _histPeriodo;
    const res   = await fetch(url, { headers: { Authorization: 'Bearer ' + REP_TOKEN }, signal: _ctrl.signal });
    clearTimeout(_tid);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.erro || 'resposta invalida');
    // 🔴 FIX 18/09 (Robert, achado real: "você tirou o zap dos leads perdidos e ganhos do histórico...
    // e tirou também a cidade e estado"): cidade/estado/whatsapp vinham hardcoded vazios porque o
    // backend ainda não devolvia esses campos quando esta função foi escrita (as 2 frentes trabalharam
    // em paralelo). Agora o backend enriquece isso ao vivo do Agendor — só mapear.
    // 🔴 FIX 19/09 (Robert: "os cards de histórico também deveriam ter os 3 botões — dados, zap,
    // maps — igual o card comum"): backend agora devolve empresa/nome/cnpj/endereço/CEP também
    // (não só telefone/cidade/estado) — mapeia tudo pra alimentar o mesmo _buildCpRows do card ativo.
    _history = (data.historico || []).map(function(h) {
      return {
        row: Number(h.dealId),
        empresa: h.empresa || h.titulo || '',
        nome: h.nome || '',
        cidade: h.cidade || '', estado: h.estado || '',
        whatsapp: h.telefone || '',
        cnpj: h.cnpj || '',
        endereco: h.endereco || '',
        cep: h.cep || '',
        status: h.statusPainel === 'Fechado' ? 'Fechado' : 'Perdido',
        valor_fech: Number(h.valor) || 0,
        data_f: h.data ? String(h.data).slice(0,10) : '',
        motivo_perd: h.motivoPerdido || '',
      };
    });
    _histLoaded = true;
    renderHistorico();
  } catch(err) {
    if (body) body.innerHTML = `<div style="padding:16px;color:#b0134a;font-size:12px">Não foi possível carregar o histórico.</div>`;
  }
}
function setHistPeriodo(periodo) {
  if (periodo === _histPeriodo) { loadHistorico(periodo); return; }
  _histPeriodo = periodo;
  _histLoaded = false; _histTab = null; _histPage = 1;
  document.querySelectorAll('#hist-periodo-toggle button').forEach(b => b.classList.toggle('on', b.dataset.periodo === periodo));
  loadHistorico(periodo);
}

  const bClass     = l.status==='Fechado' ? 'fech' : 'perd';
  const badge      = l.status==='Fechado' ? 'b-fech' : 'b-perd';
  const dataMeta   = l.data_f ? '📅 '+fmtData(l.data_f) : (l.data ? '📅 '+fmtData(l.data) : '');
  const valorMeta  = l.status==='Fechado' && (l.valor_fech>0||l.valor>0) ? cur(l.valor_fech||l.valor) : '';
  const motivoMeta = l.status==='Perdido' && (l.motivo_perd||l.motivo) ? (l.motivo_perd||l.motivo) : '';
  const wa         = fmtWA(l.whatsapp);
  // 🔴 FIX 19/09 (Robert: "os cards de histórico também deveriam ter os 3 botões — dados, zap,
  // maps — igual o card comum, tanto pra ganhos quanto perdidos"): reaproveita o MESMO
  // _buildCpRows do card ativo (nunca uma 2ª lógica pro mesmo painel de contato) — o backend agora
  // devolve empresa/CNPJ/endereço/CEP no histórico também (ver enriquecerContato).
  const phone      = fmtPhone(l.whatsapp);
  const contato    = toTitleCase(l.contato||'');
  const cnpj       = l.cnpj||'';
  const endereco   = toTitleCase(l.endereco||'');

        ${wa ? `<button class="lc-icon-btn wa" data-url="https://wa.me/${wa}" onclick="openLinkConfirm(this)" title="WhatsApp" style="width:26px;height:26px;border:none;">${SVG_WA}</button>` : ''}

    <div class="hist-meta">
      ${cidadeUF   ? `<span class="lc-tag">📍 ${esc(cidadeUF)}</span>` : ''}
      ${dataMeta   ? `<span class="lc-tag">${esc(dataMeta)}</span>` : ''}
      ${valorMeta  ? `<span class="lc-tag">💰 ${esc(valorMeta)}</span>` : ''}
      ${motivoMeta ? `<span class="lc-tag">❌ ${esc(motivoMeta)}</span>` : ''}
    </div>
    <div class="lc-contact-panel" id="cp-${l.row}">
      <div id="lcp-rows-${l.row}">${cpRows.join('')}</div>
      ${hasContact ? `<div class="lcp-wa-overlay" id="lcp-wac-${l.row}">
        <div class="lcp-wac-icon">💬</div>
        <div class="lcp-wac-msg" id="lcp-wac-msg-${l.row}"></div>

function setHistTab(tab) {
  _histTab = tab; _histPage = 1;
  renderHistorico();
}
function renderHistorico() {
  const body   = document.getElementById('hist-body');
  const counts = document.getElementById('hist-counts');
  const sec    = document.getElementById('historico-section');
  if (!body) return;
  const h     = _history || [];
  const nFech = h.filter(l=>l.status==='Fechado').length;
  const nPerd = h.filter(l=>l.status==='Perdido').length;

  if (_searchQuery.trim()) {
    const matches = _applySearch(h);
    if (counts) counts.textContent = matches.length
      ? matches.length + ' resultado' + (matches.length !== 1 ? 's' : '') + ' no histórico'
      : 'nenhum no histórico';
    if (matches.length) {
      if (sec) sec.classList.add('open');
      body.innerHTML = matches.map(_histCardHtml).join('');
    } else {
      body.innerHTML = `<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Nenhum resultado no histórico.</div>`;
    }
    return;
  }

  if (counts) counts.textContent = nFech+' fechado'+(nFech!==1?'s':'')+(nPerd?' · '+nPerd+' perdido'+(nPerd!==1?'s':''):'');
  if (!h.length) { body.innerHTML=`<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Nenhum histórico neste período.</div>`; return; }
  if (!_histTab) {
    body.innerHTML = `<div class="hist-tab-cards">
      <button class="hist-tab-card fech" onclick="setHistTab('fechados')">
        <span class="hist-tab-icon">✅</span>
        <span class="hist-tab-label">Fechados</span>
        <span class="hist-tab-count">${nFech}</span>
      </button>
      <button class="hist-tab-card perd" onclick="setHistTab('perdidos')">
        <span class="hist-tab-icon">❌</span>
        <span class="hist-tab-label">Perdidos</span>
        <span class="hist-tab-count">${nPerd}</span>
      </button>
    </div>`;
    return;
  }
  const filtered = h.filter(l => _histTab === 'fechados' ? l.status==='Fechado' : l.status==='Perdido')
    .sort((a, b) => {
      const da = a.data_f || '';
      const db = b.data_f || '';
      if (da && db) return db.localeCompare(da);
      if (da) return -1;
      if (db) return 1;
      return (b.row || 0) - (a.row || 0);
    });
  const visible  = filtered.slice(0, _histPage * HIST_PAGE_SIZE);
  const hasMore  = filtered.length > visible.length;
  const backBtn  = `<button class="hist-back-btn" onclick="setHistTab(null)">← Voltar</button>`;
  const cards    = visible.map(_histCardHtml).join('');
  const pagination = (hasMore || _histPage > 1) ? `<div class="hist-pagination">
    ${_histPage > 1 ? `<button class="hist-pg-btn" onclick="histVerMenos()">▲ Ver menos</button>` : ''}
    ${hasMore       ? `<button class="hist-pg-btn" onclick="histVerMais()">Ver mais ▾</button>` : ''}
  </div>` : '';
  body.innerHTML = backBtn + cards + pagination;
}
function histVerMais() { _histPage++; renderHistorico(); }
function histVerMenos() {
  _histPage = 1; renderHistorico();
  const hdr = document.querySelector('.hist-header');
  if (hdr) hdr.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ── FETCH & POLL ──────────────────────────────────────────────
let _isLoading  = false;
let _firstLoad  = true;
let _retryCount = 0;
const MAX_RETRIES = 2;
const CACHE_KEY = 'lifeb_cache___REP_NAME__';

async function loadData() {
  if (_isLoading) return;
  _isLoading = true;
  loadStart();
  try {
    if (_firstLoad) {
      // B6: mostra o cache local instantaneamente ao abrir, nunca tela em branco/spinner longo —
      // só troca pelo dado novo quando a resposta da rede chegar.
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (cached && cached.rep === REP_NAME && cached.leads && cached.leads.length) {
          _rawLeads  = cached.leads;
          _firstLoad = false;
          renderLeads(_rawLeads);
        } else {
          if (cached && cached.rep !== REP_NAME) localStorage.removeItem(CACHE_KEY);
          showSkeletons(3);
        }
      } catch(_) { showSkeletons(3); }
    }

    const _ctrl = new AbortController();
    const _tid  = setTimeout(() => _ctrl.abort(), 25000);
    const res   = await fetch(LEADS_URL + '?rep=' + REP_NAME, { headers: { Authorization: 'Bearer ' + REP_TOKEN }, signal: _ctrl.signal });
    clearTimeout(_tid);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const respJson = await res.json();
    if (!respJson.ok) throw new Error(respJson.erro || 'resposta invalida');
    const newLeads = (respJson.leads || []).map(_transformarLeadAgendor);

    newLeads.forEach(function(l) {
      if (l.ts_vend && l.ts_vend > (_tsMap[l.row] || 0)) _tsMap[l.row] = l.ts_vend;
    });
    try { localStorage.setItem(TS_KEY, JSON.stringify(_tsMap)); } catch(_) {}
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ rep: REP_NAME, leads: newLeads, ts: Date.now() })); } catch(_) {}

    // Se um formulário de ganho/perdido ou de tarefa está aberto pra um lead, preserva ele mesmo
    // que o servidor já não o devolva mais (evita sumir de baixo do rep enquanto ele preenche).
    _rawLeads.forEach(existing => {
      if (!newLeads.find(nl => nl.row === existing.row)) {
        const prompt = document.getElementById('sp-' + existing.row);
        const tform  = document.getElementById('task-form-' + existing.row);
        if ((prompt && prompt.classList.contains('visible')) || (tform && tform.classList.contains('visible'))) newLeads.push(existing);
      }
    });
    const hasEditingObs = Array.from(document.querySelectorAll('.lc-obs-textarea')).some(
      ta => ta.value !== (ta.closest('[data-saved]')?.dataset.saved || '')
    );
    const hasPending = !!document.querySelector('.lc-status-prompt.visible, .lead-card.concluding, .lc-task-form.visible') || hasEditingObs;
    const changed    = _firstLoad || JSON.stringify(newLeads) !== JSON.stringify(_rawLeads);
    _rawLeads = newLeads;
    if (changed && !hasPending) renderLeads(_rawLeads);
    flashDot();
    _firstLoad  = false;
    _retryCount = 0;
    const err = document.getElementById('error-banner');
    if (err) err.style.display = 'none';
  } catch(e) {
    if (_retryCount < MAX_RETRIES) {
      _retryCount++;
      _isLoading = false;
      loadEnd();
      setTimeout(loadData, 4000 * _retryCount);
      return;
    }
    _retryCount = 0;
    if (!_rawLeads.length) {
      const err = document.getElementById('error-banner');
      if (err) { err.textContent='Não foi possível carregar os dados. Verifique sua conexão.'; err.style.display='block'; }
      if (_firstLoad) { const l=document.getElementById('leads-list'); if(l) l.innerHTML=''; }
    }
  } finally { _isLoading=false; loadEnd(); }
}

// ── MÉTRICAS (valor vendido / ganhos) — 18/09/2026 ──────────────────────────
// API isolada (lifeb-rep-painel), lê o mesmo D1 que o Dashboard Geral já mantém sincronizado.
// Nunca escreve nada — só leitura. Falha de rede aqui NUNCA derruba o resto do painel (leads
// continuam funcionando normal mesmo se essa API cair) — mesmo princípio de "fail silent, dado
// antigo na tela" já usado em loadData().
let _metricPeriodo = 'mes';
let _metricLoadSeq = 0; // evita corrida: resposta antiga de um período não sobrescreve um período mais novo

async function loadMetrics(periodo) {
  const seq = ++_metricLoadSeq;
  const elValor = document.getElementById('m-valor');
  const elGanhos = document.getElementById('m-ganhos');
  const elTicket = document.getElementById('m-ticket');
  if (elValor) elValor.classList.add('loading');
  if (elGanhos) elGanhos.classList.add('loading');
  const _ctrl = new AbortController();
  const _tid  = setTimeout(() => _ctrl.abort(), 25000); // mesmo timeout usado no resto do painel
  try {
    // Token no header Authorization, nunca na URL (fix 18/09 — achado de revisão de segurança:
    // token na query string vaza em log de acesso/histórico do navegador/header Referer).
    const url = `${METRICS_URL}?rep=${encodeURIComponent(REP_NAME)}&periodo=${periodo}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${REP_TOKEN}` }, signal: _ctrl.signal });
    clearTimeout(_tid);
    const data = await res.json();
    if (seq !== _metricLoadSeq) return; // resposta obsoleta (usuário já trocou de período de novo)
    if (!data || !data.ok) throw new Error(data && data.erro || 'resposta invalida');
    if (elValor)  elValor.textContent  = data.valorVendido > 0 ? cur(data.valorVendido) : 'R$ 0';
    if (elGanhos) elGanhos.textContent = String(data.ganhos || 0);
    if (elTicket) elTicket.textContent = data.ganhos > 0 ? `ticket médio ${cur(data.ticketMedio)}` : '';
  } catch (_) {
    // fail silent — mantém o último valor bom na tela (ou '—' se é a 1ª carga)
  } finally {
    if (seq === _metricLoadSeq) {
      if (elValor) elValor.classList.remove('loading');
      if (elGanhos) elGanhos.classList.remove('loading');
    }
  }
}

function setMetricPeriodo(periodo) {
  if (periodo === _metricPeriodo) return;
  _metricPeriodo = periodo;
  document.querySelectorAll('.metric-toggle button').forEach(b => b.classList.toggle('on', b.dataset.periodo === periodo));
  loadMetrics(periodo);
}

document.addEventListener('DOMContentLoaded', () => {
  // Hint visual único na lupa pra rep perceber o campo de busca
  const lupaBt = document.getElementById('search-btn');
  if (lupaBt) { lupaBt.classList.add('hint'); lupaBt.addEventListener('animationend', () => lupaBt.classList.remove('hint'), { once:true }); }
  loadData();
  setInterval(loadData, POLL_MS);
  loadMetrics(_metricPeriodo);
  setInterval(() => loadMetrics(_metricPeriodo), METRICS_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { _retryCount = 0; loadData(); loadMetrics(_metricPeriodo); }
  });
  // Fechar histórico ao interagir com a área de leads (filtros, cards, etc.)
  // Guard: se o target foi removido do DOM pelo próprio onclick (ex: setHistTab re-renderiza body),
  // não colapsa — o usuário clicou dentro do histórico mesmo.
  document.querySelector('main').addEventListener('click', function(e) {
    if (!document.contains(e.target)) return;
    if (!e.target.closest('#historico-section')) collapseHistorico();
  });
});
