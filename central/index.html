<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Central Life B</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f5f9;--card:#fff;--fg:#1c1830;--muted:#625c7a;--faint:#8f89a6;--line:#e6e2ef;
  --purple:#704B9B;--purple-d:#4d2f73;--purple-bg:#efe9f7;--mag:#c4146d;--mag-bg:#fbe8f2;
  --ok:#157a43;--ok-bg:#e2f4ea;--warn:#9a5a06;--warn-bg:#fdf0da;--bad:#b3261e;--bad-bg:#fce9e7;--gray-bg:#eeedf3;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14111e;--card:#1c1829;--fg:#ece9f5;--muted:#aaa4c2;--faint:#7d7796;--line:#2e2942;
  --purple:#a98bd6;--purple-d:#cdbaf0;--purple-bg:#272040;--mag:#ff5fa8;--mag-bg:#3a1830;
  --ok:#5fd394;--ok-bg:#16352a;--warn:#f0b35a;--warn-bg:#3a2c12;--bad:#ff8a80;--bad-bg:#40201d;--gray-bg:#252236;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14111e;--card:#1c1829;--fg:#ece9f5;--muted:#aaa4c2;--faint:#7d7796;--line:#2e2942;
  --purple:#a98bd6;--purple-d:#cdbaf0;--purple-bg:#272040;--mag:#ff5fa8;--mag-bg:#3a1830;
  --ok:#5fd394;--ok-bg:#16352a;--warn:#f0b35a;--warn-bg:#3a2c12;--bad:#ff8a80;--bad-bg:#40201d;--gray-bg:#252236;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.hide{display:none!important}
/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.lg{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}
.lg h1{margin:0 0 4px;font-size:28px;color:var(--purple-d);letter-spacing:-.01em}
.lg p{margin:0 0 18px;color:var(--muted)}
.lg label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.lg input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
.lg .erro{color:var(--bad);font-weight:700;margin-top:10px;min-height:20px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--mag);color:#fff;min-height:44px}
.btn.sec{background:var(--card);color:var(--purple-d);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--mag)}
.btn:disabled{opacity:.55;cursor:not-allowed}
/* App */
#app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
aside{background:var(--card);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:800;font-size:20px;color:var(--purple-d);letter-spacing:-.01em}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.04em;margin-top:2px}
nav{margin-top:22px;display:flex;flex-direction:column;gap:4px}
nav .grp{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 8px 4px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:600;cursor:pointer;min-height:40px;align-items:center}
nav a:hover{background:var(--gray-bg)}
nav a.on{background:var(--purple-bg);color:var(--purple-d)}
nav a .n{font-size:12px;color:var(--faint);font-weight:700}
main{padding:26px 34px 60px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.top h2{margin:0;font-size:26px;color:var(--purple-d);letter-spacing:-.01em;flex:1;min-width:220px}
.top input[type=search]{padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-width:240px;min-height:44px}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sum b{display:block;font-size:26px;line-height:1.1;color:var(--purple-d);font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.it.alto{border-left:5px solid var(--bad)}.it.medio{border-left:5px solid var(--warn)}.it.baixo{border-left:5px solid var(--ok)}
.it h3{margin:0;font-size:16px;color:var(--purple-d)}
.it p{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--gray-bg);color:var(--muted)}
.pill.alto{background:var(--bad-bg);color:var(--bad)}.pill.medio{background:var(--warn-bg);color:var(--warn)}.pill.baixo{background:var(--ok-bg);color:var(--ok)}
.pill.on{background:var(--ok-bg);color:var(--ok)}.pill.offp{background:var(--gray-bg);color:var(--muted)}.pill.sh{background:var(--purple-bg);color:var(--purple-d)}
code{font-family:var(--mono);font-size:12px;background:var(--gray-bg);padding:2px 7px;border-radius:6px;word-break:break-all}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:9px 16px;font-weight:700;cursor:pointer;min-height:40px;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--purple);color:#fff}
.seg button:hover:not(.on){background:var(--gray-bg)}
.num{display:flex;gap:8px;align-items:center}
.num input{width:110px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:40px}
.hint{font-size:12.5px;color:var(--faint)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--gray-bg);padding:10px 14px}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;min-width:0}
td.k{font-weight:700}td .d{color:var(--muted);font-size:13px}
.tl{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center}
.ev .t{font-size:13px;color:var(--muted)}
.ev .m{font-size:14px}.ev .m b{color:var(--purple-d)}
.ev.des{opacity:.6}
.vv{font-family:var(--mono);font-size:12.5px;background:var(--gray-bg);padding:1px 6px;border-radius:6px}
.lg label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.lg input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
.frame{width:100%;height:calc(100vh - 150px);min-height:560px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.lk{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg)}
.lk:hover{border-color:var(--mag)}
.lk b{color:var(--purple-d);font-size:16px}.lk span{font-size:13.5px;color:var(--muted)}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.form label{font-weight:700;font-size:12.5px;display:block;margin-bottom:4px}
.form input,.form select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.seg button:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:1100px){.form{grid-template-columns:1fr 1fr}}
/* painel de confirmação */
#modal{position:fixed;inset:0;background:rgba(20,17,30,.55);display:grid;place-items:center;padding:20px;z-index:50}
.mb{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.mb h3{margin:0 0 4px;font-size:20px;color:var(--purple-d)}
.mb .de{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.mb label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
.mb input[type=text]{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.mb .erro{color:var(--bad);font-weight:700;min-height:20px;margin-top:8px}
.mb .acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.alerta{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
#toast{position:fixed;right:24px;bottom:24px;background:var(--purple-d);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:380px}
.vazio{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
@media (max-width:1100px){#app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{flex-direction:row;flex-wrap:wrap}nav .grp{width:100%}.grid{grid-template-columns:1fr}.sum{grid-template-columns:1fr 1fr}main{padding:20px 16px 50px}.ev{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="lg">
    <h1>Central Life B</h1>
    <p id="lgSub">Painel de controle da plataforma.</p>
    <form id="fEntrar" class="hide" autocomplete="on">
      <label for="usuario">Usuário</label>
      <input id="usuario" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="senha" style="margin-top:14px">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <div class="erro" id="loginErro" role="alert"></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="btnEntrar" type="submit">Entrar</button></div>
    </form>
    <div id="fPrimeiro" class="hide">
      <div class="alerta" style="background:var(--purple-bg);color:var(--purple-d);margin-bottom:14px">Primeiro acesso. Vou enviar um código ao WhatsApp do Robert. Depois você escolhe o seu usuário e a sua senha.</div>
      <div class="row"><button class="btn" id="btnCodigo" type="button">Enviar código ao WhatsApp</button></div>
      <form id="fCriar" class="hide" autocomplete="off" style="margin-top:16px">
        <label for="codigo">Código recebido (6 números)</label>
        <input id="codigo" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
        <label for="nUsuario" style="margin-top:14px">Seu usuário</label>
        <input id="nUsuario" type="text" autocapitalize="none" autocomplete="username" required>
        <label for="nSenha" style="margin-top:14px">Sua senha (mínimo 10, com letras e números)</label>
        <input id="nSenha" type="password" autocomplete="new-password" required>
        <label for="nSenha2" style="margin-top:14px">Repita a senha</label>
        <input id="nSenha2" type="password" autocomplete="new-password" required>
        <div class="erro" id="criarErro" role="alert"></div>
        <div class="row" style="margin-top:12px"><button class="btn" id="btnCriar" type="submit">Criar acesso</button></div>
      </form>
      <div class="erro" id="codigoErro" role="alert"></div>
    </div>
    <div class="erro" id="boot" style="color:var(--muted);font-weight:600">Conectando...</div>
  </div>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand">Central Life B<small>Painel de controle</small><small id="quem" style="margin-top:8px;color:var(--purple-d);font-weight:700"></small></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <h2 id="titulo">Estado ao vivo</h2>
      <input type="search" id="busca" placeholder="Buscar chave ou assunto" aria-label="Buscar">
      <button class="btn sec" id="btnAtualizar" type="button">Atualizar</button>
      <button class="btn sec" id="btnSair" type="button">Sair</button>
    </div>
    <div id="conteudo"></div>
  </main>
</div>

<div id="modal" class="hide" role="dialog" aria-modal="true" aria-labelledby="mTit"></div>
<div id="toast" class="hide" role="status"></div>

<script>
(function(){
'use strict';
var API='https://gs-agendor-worker.robert131196.workers.dev/central';
var S={tok:null,eu:null,dados:null,hist:null,usuarios:null,aba:'estado',busca:''};
var $=function(id){return document.getElementById(id);};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function getTok(){try{return sessionStorage.getItem('central_t');}catch(e){return null;}}
function setTok(v){try{if(v)sessionStorage.setItem('central_t',v);else sessionStorage.removeItem('central_t');}catch(e){}}
async function api(metodo,caminho,corpo){
  var h={'Content-Type':'application/json'};if(S.tok)h['x-central-token']=S.tok;
  var r=await fetch(API+caminho,{method:metodo,headers:h,body:corpo?JSON.stringify(corpo):undefined});
  var j=null;try{j=await r.json();}catch(e){}
  if(r.status===401&&S.tok&&caminho.indexOf('/acesso/')<0){sair(true);}
  return {status:r.status,j:j||{}};
}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.add('hide');},4200);}
var RISCO={alto:'Risco alto',medio:'Risco médio',baixo:'Risco baixo'};
var ROT_ESTADO={ligado:'Ligado',desligado:'Desligado',off:'Desligado',shadow:'Sombra',live:'Ao vivo'};
var PAPEL={robert:'Robert',admin:'Administrador',sdr:'SDR'};
function fmtData(ms){var d=new Date(ms);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function pode(risco){return S.eu&&(S.eu.papel==='robert'||(S.eu.papel==='admin'&&risco!=='alto'));}

/* ---------- login ---------- */
async function iniciar(){
  var t=getTok();
  if(t){S.tok=t;var r=await api('GET','/eu').catch(function(){return {status:0,j:{}};});if(r.status===200){S.eu=r.j;return abrirApp();}S.tok=null;setTok(null);}
  var e;try{e=await api('GET','/acesso/estado');}catch(x){e={status:0,j:{}};}
  $('boot').classList.add('hide');
  if(e.status!==200){$('boot').classList.remove('hide');$('boot').textContent='Não consegui falar com o servidor. Atualize a página.';return;}
  if(e.j.precisaPrimeiroAcesso){$('lgSub').textContent='Bem-vindo. Vamos criar o primeiro acesso.';$('fPrimeiro').classList.remove('hide');}
  else{$('lgSub').textContent='Entre com seu usuário e senha.';$('fEntrar').classList.remove('hide');$('usuario').focus();}
}
$('fEntrar').addEventListener('submit',async function(ev){ev.preventDefault();var b=$('btnEntrar');b.disabled=true;$('loginErro').textContent='';
  var r;try{r=await api('POST','/acesso/entrar',{usuario:$('usuario').value,senha:$('senha').value});}catch(e){r={status:0,j:{mensagem:'Sem conexão com o servidor.'}};}
  b.disabled=false;
  if(r.status===200&&r.j.token){S.tok=r.j.token;setTok(r.j.token);S.eu={usuario:r.j.usuario,nome:r.j.nome,papel:r.j.papel};$('senha').value='';abrirApp();}
  else $('loginErro').textContent=r.j.mensagem||('Erro '+r.status);});
$('btnCodigo').onclick=async function(){var b=this;b.disabled=true;$('codigoErro').textContent='';
  var r;try{r=await api('POST','/acesso/codigo');}catch(e){r={status:0,j:{mensagem:'Sem conexão com o servidor.'}};}
  if(r.status===200){$('fCriar').classList.remove('hide');$('codigoErro').style.color='var(--ok)';$('codigoErro').textContent='Código enviado. Veja o WhatsApp.';$('codigo').focus();setTimeout(function(){b.disabled=false;},20000);}
  else{$('codigoErro').style.color='var(--bad)';$('codigoErro').textContent=r.j.mensagem||('Erro '+r.status);b.disabled=false;}};
$('fCriar').addEventListener('submit',async function(ev){ev.preventDefault();$('criarErro').textContent='';
  if($('nSenha').value!==$('nSenha2').value){$('criarErro').textContent='As senhas não conferem.';return;}
  var b=$('btnCriar');b.disabled=true;var r;try{r=await api('POST','/acesso/primeiro',{codigo:$('codigo').value.trim(),usuario:$('nUsuario').value,nome:$('nUsuario').value,senha:$('nSenha').value});}catch(e){r={status:0,j:{mensagem:'Sem conexão com o servidor.'}};}
  b.disabled=false;
  if(r.status===200){var l=await api('POST','/acesso/entrar',{usuario:$('nUsuario').value,senha:$('nSenha').value});if(l.status===200){S.tok=l.j.token;setTok(l.j.token);S.eu={usuario:l.j.usuario,nome:l.j.nome,papel:l.j.papel};toast('Acesso criado');return abrirApp();}}
  $('criarErro').textContent=r.j.mensagem||('Erro '+r.status);});
async function sair(silencioso){try{if(S.tok)await fetch(API+'/acesso/sair',{method:'POST',headers:{'x-central-token':S.tok}});}catch(e){}S.tok=null;S.eu=null;setTok(null);location.reload();}
$('btnSair').onclick=function(){sair(false);};
$('btnAtualizar').onclick=function(){carregar(true);};
$('busca').addEventListener('input',function(){S.busca=this.value.trim().toLowerCase();render();});

async function abrirApp(){
  var r=await api('GET','/estado');if(r.status!==200||!r.j.ok){toast('Erro ao carregar ('+r.status+')');return;}
  S.dados=r.j;$('login').classList.add('hide');$('app').classList.remove('hide');$('quem').textContent=(S.eu.nome||S.eu.usuario)+' · '+(PAPEL[S.eu.papel]||S.eu.papel);montarNav();render();
}
async function carregar(avisar){
  var r=await api('GET','/estado');
  if(r.status===200&&r.j.ok){S.dados=r.j;if(S.aba==='hist')await carregarHist();if(S.aba==='usuarios')await carregarUsuarios();montarNav();render();if(avisar)toast('Atualizado');}
  else if(r.status!==401)toast('Não consegui atualizar ('+r.status+')');
}
async function carregarHist(){var r=await api('GET','/historico?dias=14');S.hist=(r.j&&r.j.itens)||[];}
async function carregarUsuarios(){var r=await api('GET','/usuarios');S.usuarios=(r.j&&r.j.itens)||[];}

/* ---------- navegação ---------- */
var ABAS=[['estado','Estado e controles'],['leitura','Todas as chaves'],['hist','Histórico'],['atalhos','Atalhos'],['eco','Ecossistema'],['usuarios','Usuários'],['conta','Minha conta']];
function montarNav(){
  var n=$('nav');n.textContent='';n.appendChild(el('div','grp','Controle'));
  ABAS.forEach(function(a){
    if(a[0]==='usuarios'&&S.eu.papel!=='robert')return;
    if(a[0]==='atalhos')n.appendChild(el('div','grp','Plataforma'));
    if(a[0]==='usuarios')n.appendChild(el('div','grp','Administração'));
    var l=el('a',S.aba===a[0]?'on':'');l.appendChild(el('span',null,a[1]));
    var cont=a[0]==='estado'?(S.dados.editaveis||[]).length:a[0]==='leitura'?(S.dados.leitura||[]).length:'';l.appendChild(el('span','n',String(cont)));
    l.tabIndex=0;l.onclick=async function(){S.aba=a[0];if(a[0]==='hist')await carregarHist();if(a[0]==='usuarios')await carregarUsuarios();montarNav();render();};
    l.onkeydown=function(e){if(e.key==='Enter')l.onclick();};n.appendChild(l);
  });
}
function casa(txt){return !S.busca||String(txt).toLowerCase().indexOf(S.busca)>=0;}
function render(){
  var c=$('conteudo');c.textContent='';var nome=ABAS.filter(function(a){return a[0]===S.aba;})[0][1];$('titulo').textContent=nome;
  $('busca').classList.toggle('hide',['estado','leitura','hist'].indexOf(S.aba)<0);
