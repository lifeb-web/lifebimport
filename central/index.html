<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Central Life B</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f5f9;--card:#fff;--fg:#1c1830;--muted:#625c7a;--faint:#8f89a6;--line:#e6e2ef;
  --purple:#704B9B;--purple-d:#4d2f73;--purple-bg:#efe9f7;--mag:#c4146d;--mag-bg:#fbe8f2;
  --ok:#157a43;--ok-bg:#e2f4ea;--warn:#9a5a06;--warn-bg:#fdf0da;--bad:#b3261e;--bad-bg:#fce9e7;--gray-bg:#eeedf3;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14111e;--card:#1c1829;--fg:#ece9f5;--muted:#aaa4c2;--faint:#7d7796;--line:#2e2942;
  --purple:#a98bd6;--purple-d:#cdbaf0;--purple-bg:#272040;--mag:#ff5fa8;--mag-bg:#3a1830;
  --ok:#5fd394;--ok-bg:#16352a;--warn:#f0b35a;--warn-bg:#3a2c12;--bad:#ff8a80;--bad-bg:#40201d;--gray-bg:#252236;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14111e;--card:#1c1829;--fg:#ece9f5;--muted:#aaa4c2;--faint:#7d7796;--line:#2e2942;
  --purple:#a98bd6;--purple-d:#cdbaf0;--purple-bg:#272040;--mag:#ff5fa8;--mag-bg:#3a1830;
  --ok:#5fd394;--ok-bg:#16352a;--warn:#f0b35a;--warn-bg:#3a2c12;--bad:#ff8a80;--bad-bg:#40201d;--gray-bg:#252236;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.hide{display:none!important}
/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.lg{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}
.lg h1{margin:0 0 4px;font-size:28px;color:var(--purple-d);letter-spacing:-.01em}
.lg p{margin:0 0 18px;color:var(--muted)}
.lg label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.lg input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
.lg .erro{color:var(--bad);font-weight:700;margin-top:10px;min-height:20px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--mag);color:#fff;min-height:44px}
.btn.sec{background:var(--card);color:var(--purple-d);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--mag)}
.btn:disabled{opacity:.55;cursor:not-allowed}
/* App */
#app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
aside{background:var(--card);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:800;font-size:20px;color:var(--purple-d);letter-spacing:-.01em}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.04em;margin-top:2px}
nav{margin-top:22px;display:flex;flex-direction:column;gap:4px}
nav .grp{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 8px 4px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:600;cursor:pointer;min-height:40px;align-items:center}
nav a:hover{background:var(--gray-bg)}
nav a.on{background:var(--purple-bg);color:var(--purple-d)}
nav a .n{font-size:12px;color:var(--faint);font-weight:700}
main{padding:26px 34px 60px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.top h2{margin:0;font-size:26px;color:var(--purple-d);letter-spacing:-.01em;flex:1;min-width:220px}
.top input[type=search]{padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-width:240px;min-height:44px}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sum b{display:block;font-size:26px;line-height:1.1;color:var(--purple-d);font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.it.alto{border-left:5px solid var(--bad)}.it.medio{border-left:5px solid var(--warn)}.it.baixo{border-left:5px solid var(--ok)}
.it h3{margin:0;font-size:16px;color:var(--purple-d)}
.it p{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--gray-bg);color:var(--muted)}
.pill.alto{background:var(--bad-bg);color:var(--bad)}.pill.medio{background:var(--warn-bg);color:var(--warn)}.pill.baixo{background:var(--ok-bg);color:var(--ok)}
.pill.on{background:var(--ok-bg);color:var(--ok)}.pill.offp{background:var(--gray-bg);color:var(--muted)}.pill.sh{background:var(--purple-bg);color:var(--purple-d)}
code{font-family:var(--mono);font-size:12px;background:var(--gray-bg);padding:2px 7px;border-radius:6px;word-break:break-all}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:9px 16px;font-weight:700;cursor:pointer;min-height:40px;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--purple);color:#fff}
.seg button:hover:not(.on){background:var(--gray-bg)}
.num{display:flex;gap:8px;align-items:center}
.num input{width:110px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:40px}
.hint{font-size:12.5px;color:var(--faint)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--gray-bg);padding:10px 14px}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;min-width:0}
td.k{font-weight:700}td .d{color:var(--muted);font-size:13px}
.tl{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center}
.ev .t{font-size:13px;color:var(--muted)}
.ev .m{font-size:14px}.ev .m b{color:var(--purple-d)}
.ev.des{opacity:.6}
.vv{font-family:var(--mono);font-size:12.5px;background:var(--gray-bg);padding:1px 6px;border-radius:6px}
/* painel de confirmação */
#modal{position:fixed;inset:0;background:rgba(20,17,30,.55);display:grid;place-items:center;padding:20px;z-index:50}
.mb{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.mb h3{margin:0 0 4px;font-size:20px;color:var(--purple-d)}
.mb .de{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.mb label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
.mb input[type=text]{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.mb .erro{color:var(--bad);font-weight:700;min-height:20px;margin-top:8px}
.mb .acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.alerta{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
#toast{position:fixed;right:24px;bottom:24px;background:var(--purple-d);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:380px}
.vazio{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
@media (max-width:1100px){#app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{flex-direction:row;flex-wrap:wrap}nav .grp{width:100%}.grid{grid-template-columns:1fr}.sum{grid-template-columns:1fr 1fr}main{padding:20px 16px 50px}.ev{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <form class="lg" id="fLogin" autocomplete="off">
    <h1>Central Life B</h1>
    <p>Painel de controle da plataforma. Entre com a chave da Central.</p>
    <label for="chave">Chave da Central</label>
    <input id="chave" type="password" autocomplete="current-password" required>
    <div class="erro" id="loginErro" role="alert"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="btnEntrar" type="submit">Entrar</button></div>
  </form>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand">Central Life B<small>Painel de controle</small></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <h2 id="titulo">Estado ao vivo</h2>
      <input type="search" id="busca" placeholder="Buscar chave ou assunto" aria-label="Buscar">
      <button class="btn sec" id="btnAtualizar" type="button">Atualizar</button>
      <button class="btn sec" id="btnSair" type="button">Sair</button>
    </div>
    <div id="conteudo"></div>
  </main>
</div>

<div id="modal" class="hide" role="dialog" aria-modal="true" aria-labelledby="mTit"></div>
<div id="toast" class="hide" role="status"></div>

<script>
(function(){
'use strict';
var API='https://gs-agendor-worker.robert131196.workers.dev/central';
var S={chave:null,dados:null,hist:null,aba:'estado',busca:''};
var $=function(id){return document.getElementById(id);};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function getKey(){try{return sessionStorage.getItem('central_k');}catch(e){return null;}}
function setKey(v){try{if(v)sessionStorage.setItem('central_k',v);else sessionStorage.removeItem('central_k');}catch(e){}}
async function api(metodo,caminho,corpo){
  var r=await fetch(API+caminho,{method:metodo,headers:{'x-central-key':S.chave,'Content-Type':'application/json'},body:corpo?JSON.stringify(corpo):undefined});
  var j=null;try{j=await r.json();}catch(e){}
  return {status:r.status,j:j||{}};
}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.add('hide');},3800);}
var RISCO={alto:'Risco alto',medio:'Risco médio',baixo:'Risco baixo'};
var ROT_ESTADO={ligado:'Ligado',desligado:'Desligado',off:'Desligado',shadow:'Sombra',live:'Ao vivo'};
function fmtData(ms){var d=new Date(ms);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}

/* ---------- login ---------- */
async function entrar(chave){
  S.chave=chave;$('loginErro').textContent='';
  var r;try{r=await api('GET','/estado');}catch(e){$('loginErro').textContent='Não consegui falar com o servidor. Verifique a internet.';return false;}
  if(r.status===503){$('loginErro').textContent='A Central ainda não tem chave configurada no servidor.';return false;}
  if(r.status===401){$('loginErro').textContent='Chave incorreta.';return false;}
  if(r.status!==200||!r.j.ok){$('loginErro').textContent='Erro inesperado ('+r.status+').';return false;}
  setKey(chave);S.dados=r.j;$('login').classList.add('hide');$('app').classList.remove('hide');montarNav();render();return true;
}
$('fLogin').addEventListener('submit',async function(ev){ev.preventDefault();var b=$('btnEntrar');b.disabled=true;await entrar($('chave').value.trim());b.disabled=false;});
$('btnSair').onclick=function(){setKey(null);S.chave=null;S.dados=null;$('app').classList.add('hide');$('login').classList.remove('hide');$('chave').value='';};
$('btnAtualizar').onclick=function(){carregar(true);};
$('busca').addEventListener('input',function(){S.busca=this.value.trim().toLowerCase();render();});

async function carregar(avisar){
  var r=await api('GET','/estado');
  if(r.status===200&&r.j.ok){S.dados=r.j;if(S.aba==='hist')await carregarHist();montarNav();render();if(avisar)toast('Estado atualizado');}
  else toast('Não consegui atualizar ('+r.status+')');
}
async function carregarHist(){var r=await api('GET','/historico?dias=14');S.hist=(r.j&&r.j.itens)||[];}

/* ---------- navegação ---------- */
function grupos(){var g={};(S.dados.editaveis||[]).forEach(function(e){g[e.grupo]=(g[e.grupo]||0)+1;});return g;}
function montarNav(){
  var n=$('nav');n.textContent='';
  var g=el('div','grp','Controles');n.appendChild(g);
  [['estado','Estado e controles',(S.dados.editaveis||[]).length],['leitura','Todas as chaves',(S.dados.leitura||[]).length],['hist','Histórico','']].forEach(function(a){
    var l=el('a',S.aba===a[0]?'on':'');l.appendChild(el('span',null,a[1]));l.appendChild(el('span','n',a[2]===''?'':String(a[2])));l.tabIndex=0;
    l.onclick=async function(){S.aba=a[0];if(a[0]==='hist')await carregarHist();montarNav();render();};
    l.onkeydown=function(e){if(e.key==='Enter')l.onclick();};n.appendChild(l);
  });
}

/* ---------- telas ---------- */
function casa(txt){return !S.busca||String(txt).toLowerCase().indexOf(S.busca)>=0;}
function render(){
  var c=$('conteudo');c.textContent='';
  $('titulo').textContent={estado:'Estado e controles',leitura:'Todas as chaves',hist:'Histórico de mudanças'}[S.aba];
  if(S.aba==='estado')telaEstado(c);else if(S.aba==='leitura')telaLeitura(c);else telaHist(c);
}
function badgeEstado(e){
  var p=el('span','pill',ROT_ESTADO[e.estado]||String(e.estado));
  if(e.tipo==='modo3'){p.className='pill '+(e.estado==='live'?'on':e.estado==='shadow'?'sh':'offp');}
  else if(e.tipo==='numero'){p.className='pill sh';p.textContent=e.estado+' '+(e.un||'');}
  else p.className='pill '+(e.estado==='ligado'?'on':'offp');
  return p;
}
function telaEstado(c){
  var d=S.dados.editaveis||[];
  var sum=el('div','sum');
  var cont={ligado:0,desligado:0,shadow:0,live:0};d.forEach(function(e){if(e.estado==='ligado')cont.ligado++;else if(e.estado==='desligado'||e.estado==='off')cont.desligado++;else if(e.estado==='shadow')cont.shadow++;else if(e.estado==='live')cont.live++;});
  [['Controles',d.length],['Ligados ou ao vivo',cont.ligado+cont.live],['Em sombra',cont.shadow],['Desligados',cont.desligado]].forEach(function(a){var b=el('div');b.appendChild(el('b',null,String(a[1])));b.appendChild(el('span',null,a[0]));sum.appendChild(b);});
  c.appendChild(sum);
  var por={};d.filter(function(e){return casa(e.k+' '+e.rotulo+' '+e.grupo+' '+e.desc);}).forEach(function(e){(por[e.grupo]=por[e.grupo]||[]).push(e);});
  var nomes=Object.keys(por);if(!nomes.length){c.appendChild(el('div','vazio','Nenhum controle encontrado para essa busca.'));return;}
  nomes.forEach(function(g){
    c.appendChild(el('h3',null,g)).style.cssText='margin:22px 0 10px;font-size:15px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em';
    var gr=el('div','grid');por[g].forEach(function(e){gr.appendChild(cartao(e));});c.appendChild(gr);
  });
}
function cartao(e){
  var it=el('div','it '+e.risco);
  var topo=el('div','row');topo.style.justifyContent='space-between';
  topo.appendChild(el('h3',null,e.rotulo));var dir=el('div','row');dir.appendChild(badgeEstado(e));dir.appendChild(el('span','pill '+e.risco,RISCO[e.risco]));topo.appendChild(dir);it.appendChild(topo);
  it.appendChild(el('p',null,e.desc));
  var ctl=el('div','row');
  if(e.tipo==='liga_off'||e.tipo==='flag_off1'){
    var sg=el('div','seg');['ligado','desligado'].forEach(function(v){var b=el('button',e.estado===v?'on':'',ROT_ESTADO[v]);b.type='button';b.onclick=function(){if(e.estado!==v)abrirConfirmacao(e,v);};sg.appendChild(b);});ctl.appendChild(sg);
  }else if(e.tipo==='modo3'){
    var sg2=el('div','seg');[['off','Desligado'],['shadow','Sombra'],['live','Ao vivo']].forEach(function(a){var b=el('button',e.estado===a[0]?'on':'',a[1]);b.type='button';b.onclick=function(){if(e.estado!==a[0])abrirConfirmacao(e,a[0]);};sg2.appendChild(b);});ctl.appendChild(sg2);
  }else if(e.tipo==='numero'){
    var nm=el('div','num');var inp=el('input');inp.type='number';inp.min=e.min;inp.max=e.max;inp.step=1;inp.value=e.estado;inp.setAttribute('aria-label',e.rotulo);nm.appendChild(inp);nm.appendChild(el('span','hint',e.un||''));
    var ap=el('button','btn sec','Aplicar');ap.type='button';ap.onclick=function(){var v=Number(inp.value);if(String(v)===String(e.estado))return;abrirConfirmacao(e,v);};nm.appendChild(ap);ctl.appendChild(nm);
    ctl.appendChild(el('span','hint','de '+e.min+' a '+e.max+' (padrão '+e.padrao+')'));
  }
  it.appendChild(ctl);
  var rod=el('div','row');rod.appendChild(el('code',null,e.k));rod.appendChild(el('span','hint',e.definida?('valor gravado: '+(e.cru==null?'':e.cru)):'sem valor gravado (vale o padrão)'));it.appendChild(rod);
  return it;
}
function telaLeitura(c){
  var d=(S.dados.leitura||[]).filter(function(e){return casa(e.k+' '+e.g+' '+e.d);});
  c.appendChild(el('p','hint','Chaves que a plataforma lê e que ainda não têm edição na Central (entram nas próximas fases). Só leitura.')).style.marginBottom='12px';
  if(!d.length){c.appendChild(el('div','vazio','Nenhuma chave encontrada.'));return;}
  var t=el('table');var h=el('tr');['Chave','O que faz','Padrão','Valor gravado','Risco'].forEach(function(x){h.appendChild(el('th',null,x));});t.appendChild(h);
  d.sort(function(a,b){return a.g===b.g?a.k.localeCompare(b.k):a.g.localeCompare(b.g);});
  d.forEach(function(e){var r=el('tr');var k=el('td','k');k.appendChild(el('code',null,e.k));k.appendChild(el('div','d',e.g));r.appendChild(k);r.appendChild(el('td',null,e.d));r.appendChild(el('td',null,e.p));
    var v=el('td');if(e.ok===false)v.textContent='falha na leitura';else if(e.definida){v.appendChild(el('span','vv',e.cru==null?'':e.cru));}else v.appendChild(el('span','hint','vazio'));r.appendChild(v);
    var rk=el('td');rk.appendChild(el('span','pill '+e.r,RISCO[e.r]||e.r));r.appendChild(rk);t.appendChild(r);});
  c.appendChild(t);
}
function telaHist(c){
  var h=(S.hist||[]).filter(function(x){return casa((x.rotulo||'')+' '+x.chave+' '+(x.motivo||''));});
  if(!h.length){c.appendChild(el('div','vazio','Nenhuma mudança registrada nos últimos 14 dias.'));return;}
  var tl=el('div','tl');
  h.forEach(function(x){
    var ev=el('div','ev'+(x.desfeito?' des':''));ev.appendChild(el('div','t',fmtData(x.t)));
    var m=el('div','m');var b=el('b',null,x.rotulo||x.chave);m.appendChild(b);m.appendChild(document.createTextNode(': '));
    m.appendChild(el('span','vv',x.de==null?'padrão':x.de));m.appendChild(document.createTextNode(' → '));m.appendChild(el('span','vv',x.para==null?'padrão':x.para));
    var mo=el('div','hint','Motivo: '+x.motivo+(x.desfeito?' (desfeita)':''));m.appendChild(mo);ev.appendChild(m);
    var a=el('div');if(!x.desfeito&&!/^Desfazer /.test(x.motivo||'')){var bt=el('button','btn sec','Desfazer');bt.type='button';bt.onclick=function(){abrirDesfazer(x);};a.appendChild(bt);}
    ev.appendChild(a);tl.appendChild(ev);
  });
  c.appendChild(tl);
}

/* ---------- confirmação ---------- */
function fecharModal(){$('modal').classList.add('hide');$('modal').textContent='';}
function painel(titulo,corpoFn,textoBtn,acaoFn,risco){
  var m=$('modal');m.textContent='';var b=el('div','mb');var h=el('h3',null,titulo);h.id='mTit';b.appendChild(h);
  corpoFn(b);
  var lm=el('label',null,'Motivo da mudança (obrigatório)');lm.htmlFor='mMotivo';b.appendChild(lm);var im=el('input');im.type='text';im.id='mMotivo';im.maxLength=200;im.placeholder='Ex.: manutenção da guarda';b.appendChild(im);
  var ic=null;
  if(risco==='alto'){b.appendChild(el('div','alerta','Mudança de risco alto. Ela é registrada e avisada pela Bia.')).style.marginTop='14px';var lc=el('label',null,'Digite CONFIRMO para continuar');lc.htmlFor='mConf';b.appendChild(lc);ic=el('input');ic.type='text';ic.id='mConf';ic.autocomplete='off';b.appendChild(ic);}
  var er=el('div','erro');er.setAttribute('role','alert');b.appendChild(er);
  var ac=el('div','acoes');var cx=el('button','btn sec','Cancelar');cx.type='button';cx.onclick=fecharModal;var ok=el('button','btn',textoBtn);ok.type='button';
  ok.onclick=async function(){
    var motivo=im.value.trim();if(motivo.length<5){er.textContent='Escreva o motivo (mínimo 5 letras).';im.focus();return;}
    if(ic&&ic.value.trim().toUpperCase()!=='CONFIRMO'){er.textContent='Digite CONFIRMO para continuar.';ic.focus();return;}
    ok.disabled=true;cx.disabled=true;ok.textContent='Aplicando...';er.textContent='';
    var r;try{r=await acaoFn(motivo,ic?ic.value.trim():'');}catch(e){r={status:0,j:{mensagem:'Falha de conexão.'}};}
    if(r.status===200&&r.j.ok){fecharModal();toast('Mudança aplicada e registrada');await carregar(false);}
    else{ok.disabled=false;cx.disabled=false;ok.textContent=textoBtn;er.textContent=(r.j&&r.j.mensagem)||('Erro '+r.status);}
  };
  ac.appendChild(cx);ac.appendChild(ok);b.appendChild(ac);m.appendChild(b);m.classList.remove('hide');im.focus();
  m.onkeydown=function(e){if(e.key==='Escape')fecharModal();};
}
function abrirConfirmacao(e,valor){
  var rot=function(v){return typeof v==='number'?String(v):(ROT_ESTADO[v]||String(v));};
  painel(e.rotulo,function(b){
    b.appendChild(el('p','hint',e.desc));var d=el('div','de');d.appendChild(el('span','pill',rot(e.estado)));d.appendChild(document.createTextNode('→'));d.appendChild(el('span','pill sh',rot(valor)));b.appendChild(d);
  },'Aplicar',function(motivo,conf){return api('POST','/alterar',{chave:e.k,valor:valor,motivo:motivo,confirmacao:conf});},e.risco);
}
function abrirDesfazer(x){
  var e=(S.dados.editaveis||[]).filter(function(y){return y.k===x.chave;})[0];
  painel('Desfazer: '+(x.rotulo||x.chave),function(b){var d=el('div','de');d.appendChild(el('span','vv',x.para==null?'padrão':x.para));d.appendChild(document.createTextNode('→'));d.appendChild(el('span','vv',x.de==null?'padrão':x.de));b.appendChild(d);},'Desfazer',function(motivo,conf){return api('POST','/desfazer',{id:x.id,confirmacao:conf});},e&&e.risco);
}

/* ---------- início ---------- */
var k=getKey();if(k){entrar(k).then(function(ok){if(!ok){setKey(null);}});}
})();
</script>
