<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playbook Comercial Life B</title>
<meta name="description" content="Manual de venda da Life B (uso interno, exige login da Central).">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#564B99">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{var t=localStorage.getItem('playbook.tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#f6f4fa;--surf:#fff;--surf2:#eeebf7;--ink:#1f1a38;--mut:#55507a;--line:#d8d3ea;
  --roxo:#564b99;--roxo-ink:#3f3678;--roxo-bg:#e6e2f6;--rosa:#da2f8a;--rosa-ink:#a8176a;--rosa-bg:#fbe3f0;
  --eu:#e4dff6;--lead:#fff;--ok:#17653f;--ok-bg:#e0f3e8;--nao:#a3262a;--nao-bg:#fde8e8;--av:#7a4a00;--av-bg:#fff1d2;
  --focus:#da2f8a;--sombra:0 1px 2px rgba(40,25,90,.08),0 12px 28px -20px rgba(40,25,90,.4);
  --fonte:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --base:17px;--topo:60px;
}
:root[data-theme="dark"]{
  --bg:#13102a;--surf:#1c1838;--surf2:#262147;--ink:#eeeafb;--mut:#b9b2d8;--line:#3a336e;
  --roxo:#a99df0;--roxo-ink:#cbc2fa;--roxo-bg:#2d2757;--rosa:#ff5fb0;--rosa-ink:#ff93c9;--rosa-bg:#3f1a37;
  --eu:#3a3272;--lead:#241f45;--ok:#6fe0a4;--ok-bg:#133423;--nao:#ff9a94;--nao-bg:#3f1f22;--av:#f4c06e;--av-bg:#3a2d12;
  --focus:#ff5fb0;--sombra:0 1px 2px rgba(0,0,0,.45),0 12px 28px -20px rgba(0,0,0,.8);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13102a;--surf:#1c1838;--surf2:#262147;--ink:#eeeafb;--mut:#b9b2d8;--line:#3a336e;
  --roxo:#a99df0;--roxo-ink:#cbc2fa;--roxo-bg:#2d2757;--rosa:#ff5fb0;--rosa-ink:#ff93c9;--rosa-bg:#3f1a37;
  --eu:#3a3272;--lead:#241f45;--ok:#6fe0a4;--ok-bg:#133423;--nao:#ff9a94;--nao-bg:#3f1f22;--av:#f4c06e;--av-bg:#3a2d12;
  --focus:#ff5fb0;--sombra:0 1px 2px rgba(0,0,0,.45),0 12px 28px -20px rgba(0,0,0,.8);}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topo) + 14px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fonte);font-size:var(--base);line-height:1.55;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
html.campo{font-size:19px}
body.campo{--base:19px}
h1,h2,h3,h4{margin:0;line-height:1.12;letter-spacing:-.012em;color:var(--ink);font-weight:700}
p{margin:0}ul,ol{margin:0;padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--roxo-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.skip{position:absolute;left:8px;top:-70px;z-index:500;background:var(--roxo-ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{top:8px}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:60;background:var(--surf);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--roxo) 0 62%,var(--rosa) 62% 100%)}
.top-in{min-height:calc(var(--topo) - 3px);max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:6px max(14px,env(safe-area-inset-left))}
.logo{display:block;flex:none;line-height:0}
.logo-box{display:inline-block;line-height:0}
.lg{display:block;height:auto;width:78px}
.logo-box .lgs{display:none}
:root[data-theme="dark"] .logo-box .lgp{display:none}:root[data-theme="dark"] .logo-box .lgs{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-box .lgp{display:none}:root:not([data-theme="light"]) .logo-box .lgs{display:block}}
html.campo .logo-topo .lg{width:104px}
.marca{font-weight:700;font-size:1.15rem;color:var(--roxo-ink);white-space:nowrap}
.busca{flex:1;position:relative;min-width:0;max-width:520px;margin-left:auto}
.busca input{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px 12px 8px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.res{position:absolute;left:0;right:0;top:50px;background:var(--surf);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--sombra);max-height:70vh;overflow:auto;z-index:90}
.res a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.res a:last-child{border:0}.res a:hover,.res a:focus{background:var(--roxo-bg)}
.res small{display:block;color:var(--mut);font-size:14px}
.res .vz{padding:14px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--roxo)}
.btn.pri{background:var(--roxo);border-color:var(--roxo);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#160f33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#160f33}}
.btn.rosa{background:var(--rosa-ink);border-color:var(--rosa-ink);color:#fff}
:root[data-theme="dark"] .btn.rosa{background:var(--rosa);border-color:var(--rosa);color:#2a0a1b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.rosa{background:var(--rosa);border-color:var(--rosa);color:#2a0a1b}}
.btn[aria-pressed="true"]{border-color:var(--roxo);background:var(--roxo-bg);color:var(--roxo-ink)}
.btn.peq{min-height:44px;padding:6px 12px;font-size:14px}
.ferr{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:14px;padding:3px;background:var(--bg);gap:2px}
.seg button{border:0;background:none;min-height:44px;padding:6px 12px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--roxo);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#160f33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#160f33}}
.ic-so{padding:8px 11px}
.rotulo-m{display:inline}
/* ---------- estrutura ---------- */
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:268px minmax(0,1fr);align-items:start}
.nav{position:sticky;top:var(--topo);height:calc(100vh - var(--topo));overflow:auto;padding:18px 12px 30px 14px;border-right:1px solid var(--line)}
.nav h2{font-size:.82rem;font-weight:700;color:var(--mut);margin:18px 10px 6px;letter-spacing:0}
.nav h2:first-child{margin-top:0}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:400;font-size:15.5px;line-height:1.25}
.nav a:hover{background:var(--roxo-bg)}
.nav a[aria-current="page"]{background:var(--roxo-bg);color:var(--roxo-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--rosa)}
.nav .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--roxo);color:#fff}
:root[data-theme="dark"] .nav .n{color:#160f33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav .n{color:#160f33}}
.nav a.vend .n{background:var(--rosa-ink)}
:root[data-theme="dark"] .nav a.vend .n{background:var(--rosa)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav a.vend .n{background:var(--rosa)}}
.nav a.apaga{opacity:.5}
main{min-width:0;padding:26px max(18px,env(safe-area-inset-left)) 100px 34px;outline:none}
.page{max-width:980px}
.page>h1{font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:700}
.lede{color:var(--mut);margin-top:8px;max-width:62ch}
.sec{margin-top:44px}
.sec>h2{font-size:clamp(1.25rem,2.6vw,1.6rem);margin-bottom:12px}
.sec>h2 small{font-weight:400;font-size:.8rem;color:var(--mut);margin-left:8px}
.tagpapel{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--roxo-bg);color:var(--roxo-ink);vertical-align:middle}
.tagpapel.vend{background:var(--rosa-bg);color:var(--rosa-ink)}
/* ---------- início ---------- */
.agora{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.agora a{display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:92px;padding:16px 18px;border:1.5px solid var(--line);background:var(--surf);border-radius:16px;text-decoration:none;color:var(--ink);font-weight:700;font-size:1.15rem;line-height:1.2}
.agora a small{font-weight:400;color:var(--mut);font-size:.9rem;line-height:1.3}
.agora a:hover{border-color:var(--rosa)}
.fala-grande{background:var(--roxo);color:#fff;border-radius:26px 26px 26px 6px;padding:28px 30px 24px;max-width:860px}
:root[data-theme="dark"] .fala-grande{background:#352d72;color:#f1edff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fala-grande{background:#352d72;color:#f1edff}}
.fala-grande p{font-size:clamp(1.3rem,2.6vw,1.8rem);line-height:1.3}
.fala-grande .rodape{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.fala-grande .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.5)}
.fala-grande .btn:hover{background:rgba(255,255,255,.26)}
/* ---------- mapa da jornada ---------- */
.mapa{margin-top:10px}
.mapa ol{display:flex;position:relative;padding-top:8px}
.mapa ol::before{content:"";position:absolute;left:5%;right:5%;top:34px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--roxo) 0 40%,var(--rosa) 40% 100%);opacity:.5}
.mapa li{flex:1;min-width:0;position:relative;text-align:center}
.mapa li a.no{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);padding:0 10px 4px;text-wrap:balance;font-weight:700;font-size:14px;line-height:1.2;min-height:44px}
.mapa .bola{position:relative;z-index:2;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--roxo);color:#fff;font-size:1.35rem;font-weight:700;border:4px solid var(--bg)}
:root[data-theme="dark"] .mapa .bola{color:#160f33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapa .bola{color:#160f33}}
.mapa li.vend .bola{background:var(--rosa-ink)}
:root[data-theme="dark"] .mapa li.vend .bola{background:var(--rosa)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapa li.vend .bola{background:var(--rosa)}}
.mapa li.apaga{opacity:.42}
.mapa a.no:hover .bola{transform:scale(1.07)}
.mapa .papel{font-size:12.5px;font-weight:700;color:var(--mut)}
.mapa .porta{position:absolute;z-index:3;right:-22px;top:8px;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0}
.mapa .porta span{display:block;width:15px;height:15px;transform:rotate(45deg);background:var(--bg);border:2.5px solid var(--ink);border-radius:3px}
.mapa .porta[aria-expanded="true"] span{background:var(--rosa);border-color:var(--rosa)}
.mapa li:last-child .porta{display:none}
.mapa .passa .porta span{border-color:var(--rosa);width:19px;height:19px}
.painel-porta{margin-top:14px;background:var(--surf);border:1.5px solid var(--line);border-left:6px solid var(--rosa);border-radius:14px;padding:14px 18px}
.painel-porta h3{font-size:1.05rem;margin-bottom:6px}
.painel-porta ul{display:grid;gap:4px}
.dica-mapa{color:var(--mut);font-size:14.5px;margin-top:8px}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
/* ---------- cartão de etapa ---------- */
.cab-etapa{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.cab-etapa .numero{display:flex;align-items:center;gap:10px;color:var(--mut);font-weight:700;font-size:15px}
.cab-etapa h1{font-size:clamp(2rem,5vw,3rem);margin-top:6px;font-weight:700}
.passeio{display:flex;gap:8px}
.quando{font-size:1.1rem;color:var(--mut);margin-top:6px}
.objetivo{font-size:clamp(1.15rem,2.2vw,1.45rem);font-weight:700;margin-top:12px;line-height:1.25}
.portoes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.portao{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.portao h3{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.portao li{display:flex;gap:10px;padding:5px 0;line-height:1.4}
.portao li::before{content:"";flex:none;width:16px;height:16px;margin-top:4px;border:2px solid var(--roxo);border-radius:5px}
.portao.sai{border-top:4px solid var(--rosa)}
.portao.entra{border-top:4px solid var(--roxo)}
.meta{margin-top:14px;display:flex;gap:10px;background:var(--av-bg);color:var(--av);border-radius:12px;padding:10px 14px;font-weight:400}
.momento{margin-top:14px;padding:12px 16px;border-left:5px solid var(--rosa);background:var(--surf);border-radius:0 12px 12px 0;font-size:1.12rem;font-weight:700;line-height:1.3}
/* conversa */
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.abas button{border:1.5px solid var(--line);background:var(--surf);border-radius:99px;min-height:44px;padding:6px 16px;font-weight:700;font-size:15px}
.abas button[aria-selected="true"]{background:var(--roxo);color:#fff;border-color:var(--roxo)}
:root[data-theme="dark"] .abas button[aria-selected="true"]{color:#160f33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .abas button[aria-selected="true"]{color:#160f33}}
.tela{background:var(--surf2);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;max-width:640px}
.tela-cab{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--roxo-ink)}
.tela-corpo{padding:16px 14px;display:flex;flex-direction:column;gap:9px}
.bal{position:relative;max-width:88%;padding:10px 14px 10px;border-radius:18px;line-height:1.42;font-size:1rem;box-shadow:0 1px 1px rgba(40,25,90,.08)}
.bal.lead{align-self:flex-start;background:var(--lead);border-bottom-left-radius:5px}
.bal.eu{align-self:flex-end;background:var(--eu);border-bottom-right-radius:5px;padding-right:46px}
.bal .cp{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--roxo-ink);border-radius:10px}
.bal .cp:hover{background:rgba(86,75,153,.14)}
.fala-lig{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start;padding:2px 0}
.fala-lig .q{font-size:13.5px;font-weight:700;color:var(--mut);padding-top:3px;text-align:right}
.fala-lig.eu .q{color:var(--roxo-ink)}
.fala-lig .t{position:relative;padding:8px 46px 8px 14px;border-left:4px solid var(--line);background:var(--surf);border-radius:0 12px 12px 0}
.fala-lig.eu .t{border-left-color:var(--rosa)}
.fala-lig .cp{position:absolute;right:2px;top:0;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--roxo-ink)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dica{margin-top:10px;max-width:640px;padding:10px 14px;border-radius:12px;background:var(--roxo-bg);color:var(--ink);font-size:.97rem}
.dica b{color:var(--roxo-ink)}
/* perguntas */
.perg{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.perg .qq{font-size:1.15rem;font-weight:700;line-height:1.25;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.tipo{font-size:13px;font-weight:700;color:var(--rosa-ink);margin-bottom:4px;display:block}
.leit{margin-top:10px;display:grid;gap:6px}
.leit div{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.leit b{font-weight:700}
.leit span{color:var(--mut)}
.leit span::before{content:"significa ";font-weight:700;color:var(--roxo-ink)}
/* cuidados */
.cuid{display:grid;gap:10px}
.cuid>div{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surf)}
.cuid .nao{background:var(--nao-bg);color:var(--ink);padding:12px 14px}
.cuid .sim{background:var(--ok-bg);color:var(--ink);padding:12px 14px}
.cuid small{display:block;font-weight:700;font-size:13px;margin-bottom:3px}
.cuid .nao small{color:var(--nao)}.cuid .sim small{color:var(--ok)}
.cuid .nao p{text-decoration:line-through;text-decoration-color:var(--nao);text-decoration-thickness:1.5px}
.cuid .porque{grid-column:1/-1;padding:8px 14px;font-size:.95rem;color:var(--mut);background:var(--surf)}
.lista-chk li{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:6px 0}
.lista-chk input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--roxo)}
.lista-chk label{cursor:pointer;line-height:1.4}
.lista-chk input:checked+label{color:var(--mut);text-decoration:line-through}
.fontes-d{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.fontes-d summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--mut)}
.chip-f{display:inline-block;font-size:13px;font-weight:700;color:var(--mut);background:var(--surf2);border-radius:99px;padding:2px 10px;margin:3px 4px 0 0}
/* cartões e listas */
.card{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.grade{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.modelo{display:flex;flex-direction:column;gap:8px}
.modelo h3{font-size:1.1rem}
.modelo .txt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.98rem;line-height:1.45}
mark.ph{background:var(--rosa-bg);color:var(--rosa-ink);padding:0 3px;border-radius:4px;font-weight:700}
.dep{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--av)}
html.campo .dep{font-size:1rem}
span.dep{display:inline;margin:0 0 0 4px;background:var(--av-bg);border-radius:8px;padding:1px 8px}
.nao-prom{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--nao-bg);color:var(--ink);font-weight:700}
.meta-m{font-size:14px;color:var(--mut)}
.preenche{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;padding:12px 14px;background:var(--surf);border:1.5px solid var(--line);border-radius:14px}
.preenche label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;flex:1;min-width:180px}
.preenche input{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.obj{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.obj summary{list-style:none;cursor:pointer;padding:14px 18px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:1.2rem;font-weight:700;line-height:1.2}
.obj summary::-webkit-details-marker{display:none}
.obj summary::after{content:"+";flex:none;font-size:1.6rem;color:var(--rosa-ink);font-weight:400}
.obj[open] summary::after{content:"–"}
.obj[open]{border-color:var(--roxo)}
.obj-c{padding:0 18px 16px;display:grid;gap:12px}
.obj-c .porT{color:var(--mut);font-size:.97rem}
.obj-c .resp{background:var(--eu);border-radius:14px;padding:12px 16px;position:relative}
.obj-c .volta{background:var(--rosa-bg);color:var(--ink);border-radius:14px;padding:12px 16px;border-left:5px solid var(--rosa)}
.obj-c .volta b,.obj-c .resp b,.obj-c .evite b{display:block;font-size:13px;color:var(--roxo-ink);margin-bottom:2px}
.obj-c .volta b{color:var(--rosa-ink)}
.obj-c .evite{font-size:.97rem;color:var(--nao)}
.obj-c .evite b{color:var(--nao)}
.bc{display:grid;gap:14px}
.bc .card h3{font-size:1.4rem;margin-bottom:10px}
.bc dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0}
.bc dt{font-weight:700;color:var(--roxo-ink);font-size:.95rem}
.bc dd{margin:0}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--surf);margin:8px 0 16px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--roxo-bg);color:var(--roxo-ink);font-weight:700;font-size:.9rem;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.avisoT{color:var(--mut);font-size:.95rem;margin-bottom:6px}
.confirma{display:inline-block;font-size:13px;font-weight:700;color:var(--av);background:var(--av-bg);border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.passos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px;counter-reset:p}
.passos .card{position:relative;padding-top:20px}
.passos .pn{position:absolute;top:-14px;left:14px;width:30px;height:30px;border-radius:50%;background:var(--rosa-ink);color:#fff;font-weight:700;display:grid;place-items:center;font-size:1rem}
:root[data-theme="dark"] .passos .pn{background:var(--rosa);color:#2a0a1b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .passos .pn{background:var(--rosa);color:#2a0a1b}}
.passos h3{font-size:1.1rem;margin-bottom:4px}
.passos .dica{font-size:.97rem}
.linha-tempo{position:relative;display:grid;gap:12px;padding-left:26px}
.linha-tempo::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:linear-gradient(var(--roxo),var(--rosa));border-radius:3px;opacity:.6}
.linha-tempo>li{position:relative;background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.linha-tempo>li::before{content:"";position:absolute;left:-26px;top:18px;width:15px;height:15px;border-radius:50%;background:var(--roxo);border:3px solid var(--bg)}
.linha-tempo .qd{font-size:13px;font-weight:700;color:var(--rosa-ink)}
.linha-tempo h3{font-size:1.15rem;margin:2px 0 4px}
.linha-tempo .fl{margin-top:8px;color:var(--ink);font-style:normal;padding:8px 12px;background:var(--eu);border-radius:10px}
.tira{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.tira>li{flex:0 0 190px;background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;border-top:4px solid var(--roxo)}
.tira .d{font-size:1.5rem;font-weight:700;color:var(--roxo-ink)}
.tira b{display:block}
.tira a{font-size:.95rem;display:inline-block;min-height:44px;padding-top:8px}
.tira p{font-size:.95rem;color:var(--mut);margin-top:4px}
/* treino */
.cena-t .fala-l{align-self:flex-start;max-width:90%;background:var(--lead);padding:10px 14px;border-radius:18px 18px 18px 5px;box-shadow:0 1px 1px rgba(40,25,90,.08)}
.quiz-q{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.quiz-q h3{font-size:1.1rem;margin-bottom:8px;line-height:1.25}
.quiz-q .op{display:grid;gap:8px}
.quiz-q .op button{text-align:left;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);line-height:1.3}
.quiz-q .op button.ok{border-color:var(--ok);background:var(--ok-bg)}
.quiz-q .op button.no{border-color:var(--nao);background:var(--nao-bg)}
.quiz-q .exp{margin-top:8px;font-size:.96rem;color:var(--mut)}
.placar{position:sticky;bottom:70px;z-index:10;margin-top:10px;padding:10px 16px;background:var(--roxo);color:#fff;border-radius:14px;font-weight:700}
:root[data-theme="dark"] .placar{color:#160f33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .placar{color:#160f33}}
/* cola */
.folha{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:22px 26px}
.cola-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:3px solid var(--rosa);padding-bottom:12px;margin-bottom:16px}
.cola-cab div{display:flex;flex-direction:column;text-align:right;font-size:1rem;color:var(--mut)}
.cola-cab b{color:var(--ink);font-size:1.1rem}
.logo-cola .lg{width:120px}
.cola{columns:2 300px;column-gap:34px}
.cola section{break-inside:avoid;margin-bottom:14px}
.cola h3{font-size:1.02rem;color:var(--roxo-ink);margin-bottom:4px;border-bottom:2px solid var(--rosa);display:inline-block}
.cola li{padding:2px 0 2px 14px;position:relative;font-size:.97rem;line-height:1.38}
.cola li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--roxo)}
.gloss dt{font-weight:700;font-size:1.1rem;color:var(--roxo-ink)}
.gloss dd{margin:0 0 14px;max-width:70ch}
.erro-box{max-width:560px;margin:60px auto;padding:20px;border:1.5px solid var(--nao);border-radius:14px;background:var(--nao-bg);color:var(--ink)}
.erro-box h2{margin-bottom:6px}
.erro-box .btn{margin-top:12px}
.vazio{padding:50px 16px;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:600;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;box-shadow:var(--sombra);pointer-events:none}
/* barra inferior (celular) */
.tabbar{display:none}
.menu-btn{display:none}
/* ---------- modo campo ---------- */
body.campo .mesa{display:none!important}
body.campo .btn,body.campo .abas button,body.campo .preenche label,body.campo .quiz-q .op button{font-size:1rem}
body.campo .preenche input{font-size:1rem}
body.campo .nav a,body.campo .btn{min-height:52px}
body.campo .bal,body.campo .fala-lig .t,body.campo .obj-c,body.campo .perg,body.campo .portao li{font-size:1em}
body.campo .agora{grid-template-columns:1fr}
body.campo .agora a{min-height:80px}
.so-campo{display:none}
body.campo .so-campo{display:block}
/* ---------- apresentação ---------- */
#deck{position:fixed;inset:0;z-index:700;background:var(--bg);display:flex;flex-direction:column;font-size:clamp(16px,1.7vw,24px)}
#deck.escuro{background:#1b1538;--ink:#f1edff;--mut:#cbc2fa;--line:#3a336e;--rosa-ink:#ff93c9;--roxo-ink:#cbc2fa;--surf:#241d4a;--bg:#1b1538}
#deck .d-top{display:flex;justify-content:space-between;align-items:center;padding:20px max(24px,5vw) 0}
#deck .d-top .lg{width:84px}
#deck #dPos{color:var(--mut);font-size:.9rem}
#deck.escuro .logo-box .lgp{display:none}#deck.escuro .logo-box .lgs{display:block}
#deck .stage{flex:1;overflow:auto;display:flex;padding:2vh max(24px,6vw)}
#deck .slide{margin:auto;width:100%;max-width:1100px}
#deck h2{font-size:1.6rem;margin-bottom:.5em;color:var(--roxo-ink)}
#deck h2.peq{font-size:1.1rem;color:var(--rosa-ink);margin-bottom:.9em}
#deck .msg{font-size:clamp(1.9rem,4.8vw,3.9rem);font-weight:700;line-height:1.14;letter-spacing:-.01em;color:var(--ink)}
#deck .nota{margin-top:1em;font-size:1.25rem;line-height:1.4;color:var(--mut);max-width:48ch}
#deck .capa{text-align:center;display:flex;flex-direction:column;align-items:center}
#deck .capa .lg{width:min(52vw,340px)}
#deck .capa h2{font-size:clamp(1.8rem,4.5vw,3.2rem);color:#f1edff;margin:1.1em 0 .3em}
#deck .capa .msg{font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:400;color:#cbc2fa}
#deck .etapa-s{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,56px);align-items:center}
#deck .num-g{width:clamp(88px,15vw,190px);height:clamp(88px,15vw,190px);border-radius:50%;display:grid;place-items:center;background:var(--roxo);color:#fff;font-size:clamp(3rem,8vw,6.5rem);font-weight:700}
#deck .num-g.vend{background:var(--rosa-ink)}
#deck .etapa-s h2{font-size:1.5rem;margin-bottom:.3em}
#deck .etapa-s .msg{font-size:clamp(1.7rem,3.8vw,3rem)}
#deck ul.pts{display:grid;gap:.6em;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:700}
#deck ul.pts li{padding-left:1em;position:relative;line-height:1.2}
#deck ul.pts li::before{content:"";position:absolute;left:0;top:.5em;width:.4em;height:.4em;border-radius:50%;background:var(--rosa)}
#deck .mapa{font-size:.7em}
#deck .barra{display:flex;align-items:center;gap:10px;padding:10px max(16px,4vw) calc(12px + env(safe-area-inset-bottom))}
#deck .prog{flex:1;height:6px;border-radius:6px;background:var(--line);min-width:30px}
#deck .prog i{display:block;height:100%;width:0;background:var(--rosa);border-radius:6px}
#deck.escuro .btn{background:transparent;color:#f1edff;border-color:#4a417f}
#deck.escuro .btn.pri{background:var(--roxo);color:#160f33;border-color:var(--roxo)}
/* ---------- responsivo ---------- */
@media (max-width:1100px){
  .agora{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  :root{--base:17px}
  .shell{display:block}
  .nav{position:fixed;z-index:80;top:0;left:0;bottom:0;width:min(86vw,320px);background:var(--surf);transform:translateX(-105%);visibility:hidden;transition:transform .2s;border-right:1px solid var(--line);height:auto;box-shadow:var(--sombra)}
  body.nav-aberto .nav{transform:none;visibility:visible}
  .menu-btn{display:inline-flex}
  main{padding:18px 16px 110px}
  .top{position:static}
  html{scroll-padding-top:12px}
  .top-in{flex-wrap:wrap;gap:8px}
  .busca{order:5;flex-basis:100%;max-width:none;margin-left:0}
  html.campo .top{position:sticky}
  html.campo .busca,html.campo .seg{display:none}
  .marca{display:none}
  .rotulo-m{display:none}
  .ferr{display:contents}
  .seg{order:4;flex:1}
  .seg button{flex:1;padding:6px 6px}
  #campoBtn,#apBtn,#temaBtn{order:3}
  .menu-btn{order:0}
  .logo{order:1;margin-right:auto}
  .portoes{grid-template-columns:1fr}
  .cuid>div{grid-template-columns:1fr}
  .leit div{grid-template-columns:1fr;gap:2px}
  .bc dl{grid-template-columns:1fr;gap:2px}
  .bc dd{margin-bottom:8px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:70;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:12.5px;font-weight:700;color:var(--mut);text-decoration:none;border:0;background:none;padding:4px 2px}
  .tabbar [aria-current="page"]{color:var(--roxo-ink)}
  .tabbar svg{width:22px;height:22px}
  /* mapa vertical */
  .mapa ol{flex-direction:column;padding:0 0 0 0}
  .mapa ol::before{left:25px;right:auto;top:20px;bottom:20px;width:4px;height:auto;background:linear-gradient(var(--roxo) 0 40%,var(--rosa) 40% 100%)}
  .mapa li{text-align:left;display:flex;align-items:center;min-height:80px}
  .mapa li a.no{flex-direction:row;gap:14px;font-size:1.02rem;flex:1;padding:2px 0}
  .mapa .bola{width:48px;height:48px;font-size:1.25rem}
  .mapa .porta{left:3px;right:auto;top:auto;bottom:-22px;z-index:4}
  .mapa li:last-child .porta{display:none}
  .mapa .papel{margin-left:auto;padding-right:30px}
  .cola{columns:1}
  #deck .stage{padding:3vh 5vw}
}
@media (max-width:600px){
  #deck .barra{gap:8px;padding-left:12px;padding-right:12px}
  #deck #dFs{display:none}
  #deck .barra .btn{padding:8px 12px}
}
@media (max-width:420px){
  .agora{grid-template-columns:1fr}
  .bal{max-width:94%}
  .fala-lig{grid-template-columns:62px 1fr;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- impressão: só a cola ---------- */
@media print{
  body{background:#fff;color:#000;font-size:10pt}
  .top,.nav,.tabbar,#toast,#deck,.acoes,.no-print,.skip,.res{display:none!important}
  .shell{display:block}main{padding:0}
  .page>h1{font-size:18pt}
  .folha{border:0;padding:0;background:#fff}
  .cola-cab{border-bottom:2px solid #da2f8a}.cola-cab div,.cola-cab b{color:#000}
  .logo-box .lgp{display:block!important}.logo-box .lgs{display:none!important}
  .cola{columns:2;column-gap:20px;background:#fff}
  .cola h3{font-size:10.5pt;color:#3f3678}
  .cola li{font-size:9pt;line-height:1.3}
  @page{size:A4;margin:12mm}
}

  $('#q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var a = $('#res a'); if (a) { W.location.hash = a.getAttribute('href'); this.blur(); } } if (e.key === 'Escape') { $('#res').hidden = true; } });
  D.addEventListener('click', function (e) { if (!e.target.closest('.busca')) $('#res').hidden = true; if (D.body.classList.contains('nav-aberto') && !e.target.closest('#nav') && !e.target.closest('#menuBtn') && !e.target.closest('#tabbar')) alterna(false); });
  W.addEventListener('hashchange', function () { if (/^#slide-/.test(W.location.hash)) { if (DADOS) abreDeck((parseInt(W.location.hash.slice(7), 10) || 1) - 1); } else rota(); });

  /* ---------- apresentação: uma mensagem grande por slide, logo fixa no canto ---------- */
  var slides = [], di = 0, deckAberto = false;
  function slideDom(s, i, n) {
    var num = ('0' + (i + 1)).slice(-2) + ' / ' + n;
    if (s.tipo === 'capa' || s.tipo === 'fecho') return h('div', { class: 'slide capa' }, logo('logo-capa', 'Life B'), h('h2', { text: s.titulo }), h('p', { class: 'msg', text: s.msg }));
    if (s.tipo === 'mapa') return h('div', { class: 'slide' }, h('h2', { text: s.titulo }), mapa({ semLeg: true }));
    if (s.tipo === 'etapa') return h('div', { class: 'slide etapa-s' }, h('div', { class: 'num-g ' + s.papel, text: String(s.num) }), h('div', null, h('h2', { text: s.titulo }), h('p', { class: 'msg', text: s.msg }), h('p', { class: 'nota', text: s.nota })));
    if (s.tipo === 'lista') return h('div', { class: 'slide' }, h('h2', { text: s.titulo }), h('ul', { class: 'pts' }, s.itens.map(function (t) { return h('li', { text: t }); })));
    return h('div', { class: 'slide' }, h('h2', { class: 'peq', text: s.titulo }), h('p', { class: 'msg', text: s.msg }), s.nota ? h('p', { class: 'nota', text: s.nota }) : null);
  }
  function mostraSlide(i) {
    di = Math.max(0, Math.min(slides.length - 1, i)); var st = $('#stage'); st.textContent = ''; var sl = slides[di];
    st.appendChild(slideDom(sl, di, slides.length));
    $('#deck').classList.toggle('escuro', sl.tipo === 'capa' || sl.tipo === 'fecho');
    $('#dPos').textContent = ('0' + (di + 1)).slice(-2) + ' / ' + slides.length; $('#dProg').style.width = ((di + 1) / slides.length * 100) + '%'; st.scrollTop = 0;
    try { W.history.replaceState(null, '', '#slide-' + (di + 1)); } catch (e) {}
  }
  function abreDeck(i) { if (!DADOS) return; slides = DADOS.apresentacao || []; if (!slides.length) return; deckAberto = true; $('#deck').hidden = false; D.body.style.overflow = 'hidden'; mostraSlide(i || 0); $('#dProx').focus(); }
  function fechaDeck() { deckAberto = false; $('#deck').hidden = true; D.body.style.overflow = ''; if (D.fullscreenElement && D.exitFullscreen) D.exitFullscreen(); try { W.history.replaceState(null, '', rotaAtual && rotaAtual !== 'inicio' ? '#/' + rotaAtual : '#/'); } catch (e) {} $('#apBtn').focus(); }
  $('#apBtn').addEventListener('click', function () { abreDeck(0); });
  $('#dFecha').addEventListener('click', fechaDeck); $('#dAnt').addEventListener('click', function () { mostraSlide(di - 1); }); $('#dProx').addEventListener('click', function () { mostraSlide(di + 1); });
  $('#dFs').addEventListener('click', function () { var el = $('#deck'); if (D.fullscreenElement) D.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); });
  D.addEventListener('keydown', function (e) {
    if (deckAberto) { if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); mostraSlide(di + 1); } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { mostraSlide(di - 1); } else if (e.key === 'Escape') fechaDeck(); else if (e.key === 'Home') mostraSlide(0); else if (e.key === 'End') mostraSlide(slides.length - 1); return; }
    if (e.key === '/' && !/INPUT|TEXTAREA/.test((D.activeElement || {}).tagName || '')) { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'Escape') { alterna(false); $('#res').hidden = true; }
  });
  W.__playbook = { deck: function () { return { aberto: deckAberto, i: di, n: slides.length }; }, abre: abreDeck, fecha: fechaDeck };

  /* ---------- carga: o conteúdo NÃO está nesta página; vem do servidor da Central, só com a sessão da Central ---------- */
  function lerToken() {
    try { var r = W.localStorage.getItem(SESS_P); if (r) { var o = JSON.parse(r); if (o && typeof o.t === 'string' && o.t && !(Number(o.ate) && Number(o.ate) < Date.now())) return o.t; } } catch (e) {}
    try { var t = W.sessionStorage.getItem(SESS_S), ate = Number(W.sessionStorage.getItem(SESS_ATE)) || 0; if (t && !(ate && ate < Date.now())) return t; } catch (e) {}
    return null;
  }
  function tela(titulo, texto, botao) { var app = $('#app'); app.textContent = ''; $('#nav').textContent = ''; $('#tabbar').textContent = ''; var c = h('div', { class: 'erro-box', role: 'alert' }, h('h2', { text: titulo }), h('p', { text: texto })); if (botao) c.appendChild(botao); app.appendChild(c); }
  function pedeLogin(t) { tela('Entre na Central para ver o playbook', t || 'O playbook é de uso interno e só abre com o seu acesso da Central.', h('a', { class: 'btn pri', href: '/central/', text: 'Entrar na Central' })); }
  function erro(m) { var b = h('button', { type: 'button', class: 'btn pri', text: 'Tentar de novo' }); b.addEventListener('click', carrega); tela('Não foi possível abrir o playbook', m, b); }
  function carrega() {
    var tok = lerToken(); if (!tok) { pedeLogin(); return; }
    $('#app').textContent = ''; $('#app').appendChild(h('div', { class: 'vazio', text: 'Carregando o playbook...' }));
    var tent = 0;
    function tenta() {
      tent++;
      W.fetch(API, { cache: 'no-store', headers: { 'x-central-token': tok } }).then(function (r) {
        if (r.status === 401) { var e = new Error('sessao'); e.sessao = true; throw e; }
        if (r.status === 403) { var e2 = new Error('perfil'); e2.perfil = true; throw e2; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (j) {
        var c = j && j.conteudo; if (!c || c.esquema !== 2 || !c.jornada || !c.fontes || !c.apresentacao) throw new Error('resposta em formato antigo ou incompleto');
        DADOS = c; var p = ls('g', ST.papel); if (p && c.papeis.some(function (x) { return x.id === p; })) papel = p;
        estado.eu = ls('g', ST.eu) || '';
        montaPapeis(); montaNav(); indexa(); slides = [];
        if (!W.location.hash) { try { W.history.replaceState(null, '', '#/'); } catch (e) {} }
        if (/^#slide-/.test(W.location.hash)) { rota(); $('#app').textContent = ''; $('#app').appendChild(ROTAS.inicio()); abreDeck((parseInt(W.location.hash.slice(7), 10) || 1) - 1); } else rota();
      }).catch(function (e) {
        if (e && e.sessao) { pedeLogin('Sua sessão da Central expirou. Entre de novo para ver o playbook.'); return; }
        if (e && e.perfil) { tela('Sem acesso ao playbook', 'O seu perfil da Central não tem acesso ao playbook comercial. Peça ao Robert para liberar.'); return; }
        if (tent < 3) setTimeout(tenta, 800 * tent); else erro(e && e.message ? 'Falha ao carregar (' + e.message + ').' : 'Falha ao carregar.');
      });
    }
    tenta();
  }
  function limpa() { if (!DADOS) return; if (deckAberto) fechaDeck(); DADOS = null; slides = []; INDICE = []; $('#q').value = ''; $('#res').hidden = true; $('#papeis').textContent = ''; pedeLogin('A sua sessão da Central terminou. Entre de novo para ver o playbook.'); }
  function confereSessao() { if (DADOS && !lerToken()) limpa(); }
  W.addEventListener('storage', function (e) { if (!e.key || e.key === SESS_P || e.key === SESS_S || e.key === SESS_ATE) confereSessao(); });
  W.addEventListener('focus', confereSessao);
  D.addEventListener('visibilitychange', function () { if (!D.hidden) confereSessao(); });
  setInterval(confereSessao, 30000);
  /* logo do topo */
  $('#logoTopo').appendChild(logo('logo-topo'));
  $('#dLogo').appendChild(logo('logo-deck'));
  aplicaTema(null); if (ls('g', ST.campo) === '1') aplicaCampo(true);
  carrega();
})();
</script>
