<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playbook Comercial Life B</title>
<meta name="description" content="Playbook comercial da Life B (uso interno, exige login da Central).">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{var t=localStorage.getItem('playbook.tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f5f2fa;--card:#fff;--card2:#faf8fd;--line:#dcd4ea;--fg:#1d1630;--muted:#4b4463;--faint:#625a7c;
  --purple:#5a3a8a;--purple-d:#3f2767;--purple-bg:#efe9f9;--mag:#bf126b;--mag-bg:#fde6f1;
  --green-t:#0b6a30;--green-bg:#e0f4e7;--green-l:#1c9b4d;--amber-t:#7a4300;--amber-bg:#fff0d4;--red-t:#a01616;--red-bg:#fdeaea;--blue-t:#1f4f95;--blue-bg:#e4edfb;--gray-bg:#ece8f3;
  --btn:#3f2767;--btn-fg:#fff;--focus:#bf126b;--shadow:0 1px 2px rgba(50,30,90,.07),0 10px 28px -18px rgba(50,30,90,.35);
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mast:60px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#110d1f;--card:#1b1630;--card2:#211b3a;--line:#392f62;--fg:#efeaf9;--muted:#c2bbdb;--faint:#a79fc4;
  --purple:#b9a0f2;--purple-d:#d9ccfa;--purple-bg:#2a2250;--mag:#ff74b3;--mag-bg:#3d1a34;
  --green-t:#63dc9e;--green-bg:#123325;--green-l:#4bd18a;--amber-t:#f3bb68;--amber-bg:#3a2c10;--red-t:#ff9188;--red-bg:#3e1f1c;--blue-t:#9cc2f7;--blue-bg:#14253d;--gray-bg:#262040;
  --btn:#b9a0f2;--btn-fg:#1a1030;--focus:#ff74b3;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#110d1f;--card:#1b1630;--card2:#211b3a;--line:#392f62;--fg:#efeaf9;--muted:#c2bbdb;--faint:#a79fc4;
  --purple:#b9a0f2;--purple-d:#d9ccfa;--purple-bg:#2a2250;--mag:#ff74b3;--mag-bg:#3d1a34;
  --green-t:#63dc9e;--green-bg:#123325;--green-l:#4bd18a;--amber-t:#f3bb68;--amber-bg:#3a2c10;--red-t:#ff9188;--red-bg:#3e1f1c;--blue-t:#9cc2f7;--blue-bg:#14253d;--gray-bg:#262040;
  --btn:#b9a0f2;--btn-fg:#1a1030;--focus:#ff74b3;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.7);}
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--mast) + 66px);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:var(--purple-d)}
img{max-width:100%}
h1,h2,h3,h4{margin:0;line-height:1.22;text-wrap:balance}
p{margin:0 0 .75em}
ul,ol{margin:.4em 0 .8em;padding-left:1.25em}
li{margin:.3em 0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
[hidden]{display:none!important}
/* barra de topo */
.mast{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.mast::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--purple) 0%,var(--mag) 70%,var(--green-l) 100%)}
.mast-in{height:calc(var(--mast) - 3px);max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.mast img{height:32px;width:auto;display:block}
.mast img.logo-escuro{display:none}
:root[data-theme="dark"] .mast img.logo-claro{display:none}:root[data-theme="dark"] .mast img.logo-escuro{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mast img.logo-claro{display:none}:root:not([data-theme="light"]) .mast img.logo-escuro{display:block}}
.mast a.logo{display:block;flex:none;width:72px;height:32px;overflow:hidden}
.mast a.logo img{width:72px;height:32px;object-fit:contain}
.nm{font-weight:800;color:var(--purple-d);white-space:nowrap}
.nm small{font-weight:600;color:var(--faint);font-size:12px;margin-left:4px}
.grow{flex:1}
.btn{font:inherit;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--purple)}
.btn.pri{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-bg)}
.btn.pri[aria-pressed="true"]{background:var(--btn)}
.papelbar{position:sticky;top:var(--mast);z-index:30;background:var(--card2);border-bottom:1px solid var(--line);padding:6px max(14px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.papelbar .pl{font-size:13px;font-weight:700}
.seg{display:inline-flex;gap:4px;padding:3px;border:1.5px solid var(--line);border-radius:12px;background:var(--card2)}
.seg .btn{min-height:38px;padding:5px 12px;border-color:transparent;background:transparent}
.seg .btn[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
/* estrutura */
.shell{display:grid;grid-template-columns:minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(86vw,330px);background:var(--card);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s;overflow:auto;padding:16px 14px 28px;visibility:hidden}
.side.open{transform:none;visibility:visible;box-shadow:0 0 0 100vmax rgba(10,5,25,.55)}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.side-h b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.busca{width:100%;font:inherit;font-size:15px;background:var(--card2);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;margin-bottom:6px}
.busca-r{font-size:13px;color:var(--faint);min-height:1.2em;margin-bottom:8px}
.toc{list-style:none;margin:0;padding:0}
.toc .gr{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800;margin:16px 0 4px;padding:0 10px}
.toc a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;line-height:1.3;border-left:3px solid transparent}
.toc a:hover{background:var(--purple-bg);color:var(--fg)}
.toc a[aria-current="true"]{background:var(--purple-bg);color:var(--purple-d);border-left-color:var(--mag);font-weight:800}
.toc li.off{display:none}
@media (min-width:1000px){
  .shell{grid-template-columns:300px minmax(0,1fr)}
  .side{position:sticky;top:var(--mast);height:calc(100vh - var(--mast));transform:none;visibility:visible;width:auto;box-shadow:none;z-index:5}
  .side.open{box-shadow:none}
  #menuBtn,.side-h .fechar{display:none}
}
main{min-width:0}
.hero{background:linear-gradient(120deg,#3f2767,#6c3fa0 60%,#b4136a);color:#fff;padding:34px max(16px,env(safe-area-inset-left)) 30px}
:root[data-theme="dark"] .hero{background:linear-gradient(120deg,#2a1a52,#4b2a86 60%,#8a1356)}
.hero-in{max-width:1080px;margin:0 auto}
.hero h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:800}
.hero p{margin:.6em 0 0;max-width:62ch;opacity:.95}
.hero .aviso{font-size:.92em;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;margin-top:16px}
.sec{padding:34px max(16px,env(safe-area-inset-right)) 22px max(16px,env(safe-area-inset-left))}
.sec-in{max-width:1080px;margin:0 auto}
.sec h2{font-size:clamp(1.35rem,3.5vw,1.8rem);font-weight:800;color:var(--purple-d)}
.sec h2::after{content:"";display:block;width:2.4em;height:.14em;border-radius:9px;margin-top:.35em;background:linear-gradient(90deg,var(--purple),var(--mag))}
.kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mag);margin-bottom:6px}
.obj{color:var(--muted);margin:.7em 0 1em}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid.dois{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--purple);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:1.02rem;font-weight:800;margin-bottom:.4em;color:var(--fg)}
.card.t-dizer{border-left-color:var(--blue-t)}.card.t-nao_dizer{border-left-color:var(--red-t)}.card.t-erros{border-left-color:var(--amber-t)}.card.t-metrica{border-left-color:var(--green-l)}
.card.t-dizer h3{color:var(--blue-t)}.card.t-nao_dizer h3{color:var(--red-t)}.card.t-erros h3{color:var(--amber-t)}.card.t-metrica h3{color:var(--green-t)}
.card.full{grid-column:1/-1}
.card ul,.card ol{padding-left:1.1em}
.fontes{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:.35em;vertical-align:baseline}
.fonte{font-size:11.5px;font-weight:600;color:var(--faint);background:var(--gray-bg);border-radius:99px;padding:1px 8px;white-space:normal}
.validar{display:inline-block;font-size:12px;font-weight:700;color:var(--amber-t);background:var(--amber-bg);border-radius:8px;padding:1px 8px;margin-left:.3em}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;margin:.4em 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--purple-bg);color:var(--purple-d);font-weight:800;font-size:13px}
tr:last-child td{border-bottom:0}
.obj-i{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.obj-i h4{font-size:1rem;color:var(--mag);margin-bottom:.35em}
.obj-i .r{margin:0 0 .5em}
.obj-i .q{margin:0;font-weight:700;color:var(--purple-d)}
.cmp{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.cmp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ma,.boa{border-radius:12px;padding:10px 12px}
.ma{background:var(--red-bg);color:var(--red-t)}.boa{background:var(--green-bg);color:var(--green-t)}
.ma b,.boa b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.chk{list-style:none;padding-left:0}
.chk li{display:flex;gap:10px;align-items:flex-start}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--purple)}
.chk label{cursor:pointer;min-width:0}
.quiz-q{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.quiz-q h4{font-size:1rem;margin-bottom:.5em}
.quiz-q .ops{display:grid;gap:8px}
.quiz-q .ops .btn{justify-content:flex-start;text-align:left;font-weight:600;height:auto}
.quiz-q .ops .btn.ok{border-color:var(--green-l);background:var(--green-bg);color:var(--green-t)}
.quiz-q .ops .btn.no{border-color:var(--red-t);background:var(--red-bg);color:var(--red-t)}
.quiz-q .gab{margin-top:.6em;font-size:.95em}
.fonte-lista{display:grid;gap:8px}
.fonte-lista div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.fonte-lista b{color:var(--purple-d)}
.vazio{padding:40px 16px;text-align:center;color:var(--muted)}
.erro-box{max-width:560px;margin:60px auto;padding:20px;border:1.5px solid var(--red-t);border-radius:14px;background:var(--red-bg);color:var(--red-t)}
footer{padding:26px 16px 80px;text-align:center;color:var(--faint);font-size:13px}
@media (max-width:640px){.nm{display:none}#menuBtn .tx,#temaBtn .tx,#apBtn .tx{display:none}.mast .btn{padding:8px 11px}.seg .btn{padding:5px 9px}}
@media print{.mast,.side,.deck,.skip{display:none!important}.shell{display:block}.card{break-inside:avoid;box-shadow:none}}

/* ===== MODO APRESENTAÇÃO (mesmo mecanismo da página Ecossistema) ===== */
html.deck-on,html.deck-on body{overflow:hidden;height:100%}
.deck{position:fixed;inset:0;z-index:300;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);
  background-image:radial-gradient(1200px 700px at 85% -10%,color-mix(in srgb,var(--purple) 16%,transparent),transparent 70%),radial-gradient(900px 600px at -5% 105%,color-mix(in srgb,var(--mag) 12%,transparent),transparent 70%)}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;font-size:30px;line-height:1.36;opacity:0;visibility:hidden;transform:translateX(48px);transition:opacity .5s ease,transform .5s ease,visibility 0s linear .5s}
.slide.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide.sai{transform:translateX(-48px)}
.sl-in{position:absolute;inset:0;padding:64px 110px 120px;display:flex;flex-direction:column;gap:28px}
.stage.port .slide{font-size:40px}
.stage.port .sl-in{padding:84px 70px 170px;gap:36px}
.sl-h{display:flex;flex-direction:column;gap:10px}
.slide .kick{font-size:.8em;margin:0}
.slide h2{font-size:2.15em;font-weight:800;letter-spacing:-.01em;color:var(--purple-d)}
.slide h2::after{content:"";display:block;width:2.4em;height:.12em;border-radius:9px;margin-top:.35em;background:linear-gradient(90deg,var(--purple),var(--mag))}
.sl-b{flex:1;min-height:0;display:flex;flex-direction:column;gap:24px;justify-content:center;min-width:0}
.slide p{margin:0}
.slide .lead{color:var(--muted);font-size:.9em}
.slide ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em}
.slide li{margin:0;padding-left:1.15em;position:relative}
.slide li::before{content:"";position:absolute;left:0;top:.62em;width:.45em;height:.45em;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--mag))}
.slide .s-ti{font-size:1.2em;font-weight:800;color:var(--purple-d)}
.slide .t-nao_dizer .s-ti{color:var(--red-t)}.slide .t-erros .s-ti{color:var(--amber-t)}.slide .t-metrica .s-ti{color:var(--green-t)}.slide .t-dizer .s-ti{color:var(--blue-t)}
.slide .fontes{margin:0}
.slide .fonte{font-size:.62em}
.slide .validar{font-size:.62em}
.slide .tw{overflow:visible;border:0}
.slide table{min-width:0;font-size:.82em}
.slide th{font-size:.8em}
.slide .dg{display:grid;gap:22px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stage.port .slide .dg{grid-template-columns:1fr}
.slide .dcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.slide .dcard h3{font-size:1.05em;color:var(--mag)}
.slide .dcard .q{font-weight:700;color:var(--purple-d)}
.slide .ma,.slide .boa{padding:14px 18px}
.slide .opq{display:flex;flex-direction:column;gap:12px}
.slide .opq .op{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 18px}
.slide .opq .op.ok{border-color:var(--green-l);background:var(--green-bg);color:var(--green-t)}
.slide .gab[hidden]{display:none}
.slide .gab{background:var(--green-bg);color:var(--green-t);border-radius:16px;padding:12px 18px}
.slide .mostra{align-self:flex-start;font-size:.7em}
.slide.s-capa .sl-b{justify-content:center}
.slide.s-capa h2{font-size:3em}
.dprog{position:absolute;left:0;right:0;top:0;height:6px;background:transparent;z-index:5}
.dprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--mag));transition:width .35s}
.dctl{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(8px);transition:opacity .4s}
.deck.quieto .dctl{opacity:0;pointer-events:none}
.deck.quieto{cursor:none}
.db{width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--purple-d);display:grid;place-items:center;cursor:pointer}
.db:hover:not(:disabled){background:var(--purple-bg)}
.db:disabled{opacity:.35;cursor:default}
.db svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dind{white-space:nowrap;font-weight:700;font-size:15px;color:var(--muted);min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.dsep{width:1px;height:26px;background:var(--line);margin:0 4px}
.dlogo{position:absolute;left:30px;bottom:calc(16px + env(safe-area-inset-bottom));height:48px;z-index:4;pointer-events:none;opacity:.92}
.dlogo img{height:100%;width:auto;display:block}
.dlogo .le{display:none}
:root[data-theme="dark"] .dlogo .lc{display:none}:root[data-theme="dark"] .dlogo .le{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dlogo .lc{display:none}:root:not([data-theme="light"]) .dlogo .le{display:block}}
.deck.cov .dlogo{display:none}
@media (max-height:500px){.dlogo{height:30px;left:16px;bottom:10px}}
.deck:has(.stage.port) .dlogo{left:auto;right:14px;bottom:auto;top:calc(10px + env(safe-area-inset-top));height:30px}
@media (max-width:420px){.dctl{gap:0;padding:4px 6px}.db{width:40px;height:40px}.dind{min-width:60px;font-size:13px}.dsep{margin:0 1px}}
.didx{position:absolute;inset:0;z-index:9;overflow:auto;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(8px);padding:20px 28px 100px}
.didx .ix-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.didx h2{font-size:1.4rem;color:var(--purple-d)}
.didx h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.ix-l{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ix-b{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;font:600 14px/1.25 var(--font);cursor:pointer}
.ix-b b{width:2.1em;height:2.1em;border-radius:50%;background:var(--purple-bg);color:var(--purple-d);display:grid;place-items:center;font-size:12px;flex:none}
.ix-b:hover{border-color:var(--purple)}.ix-b.on{border-color:var(--mag);box-shadow:0 0 0 2px color-mix(in srgb,var(--mag) 30%,transparent)}
</style>
</head>
<body>
